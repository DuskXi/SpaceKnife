[package]
name = "spaceknife-console"
description = "SpaceKnife.com: the console entry of the Windows app, so a terminal waits for it (headless mode)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# No dependencies: a few kernel32 calls. Shipped next to SpaceKnife.exe as SpaceKnife.com, in the
# Electron shell's installer (apps/electron-shell/scripts/package.mjs) and the Windows portable
# copies (docs/packaging.md).

[[bin]]
name = "spaceknife-console"
path = "src/main.rs"
