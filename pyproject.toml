# SpaceKnife workspace root (virtual: no package of its own).
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
spaceknife-protocol = { workspace = true }
spaceknife-backend = { workspace = true }
spaceknife-client = { workspace = true }
spaceknife-native = { workspace = true }

[dependency-groups]
dev = [
  "spaceknife-protocol",
  "spaceknife-backend",
  "spaceknife-client",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "hypothesis>=6.170.1",
  "resvg-py>=0.5.0",
  "pillow>=13.0.0",
]

# Rust/PyO3 acceleration: needs a Rust toolchain to build (`uv sync --group native`); optional
native = ["spaceknife-native"]
# M8 installers: the frozen backend (tools/build_package.py; `uv sync --group native --group package`)
package = ["pyinstaller>=6.11", "maturin>=1.9,<2"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/*/src", "tools"]
extend-exclude = ["packages/client/src/spaceknife_client/tokens.py"]  # generated by tools/gen_design.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # full-width CJK punctuation in Chinese strings/comments is intentional

[tool.ruff.lint.isort]
known-first-party = ["spaceknife", "spaceknife_protocol", "spaceknife_client", "spaceknife_native"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/protocol/src", "packages/backend/src", "packages/client/src", "packages/native/python"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tools"]
testpaths = ["packages/protocol/tests", "packages/backend/tests", "packages/client/tests", "packages/native/tests", "tools/tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
# Dev-only demo tools: long HTML/CSS templates and Chinese UI strings read better unwrapped.
"tools/preview_design.py" = ["E501"]
"tools/demo/*" = ["E501"]
"packages/backend/src/spaceknife/cli_scan.py" = ["E501"]  # Chinese UI strings
"packages/*/tests/*" = ["E501", "PT018", "ASYNC240"]
