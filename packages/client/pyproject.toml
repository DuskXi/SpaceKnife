[project]
name = "spaceknife-client"
version = "0.1.0"
description = "SpaceKnife shared Python client core for the native frontends (no GUI dependencies)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "spaceknife-protocol",
  "pydantic>=2.9",
  "numpy>=2.1",
  "websockets>=15.0",
]

[tool.uv.sources]
spaceknife-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"
