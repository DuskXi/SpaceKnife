[project]
name = "spaceknife-sdk"
version = "0.1.0"
description = "SpaceKnife plugin SDK: declare commands, reports, visualizations and more; the host does the wiring"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "spaceknife-protocol",
  "pydantic>=2.9",
  "numpy>=2.1",
  # zoneinfo (on the plugins allow-list) has no time zones on Windows without it; the packaged
  # app bundles it too (packaging/plugin_imports.py)
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[tool.uv.sources]
spaceknife-protocol = { workspace = true }

[tool.uv.build-backend]
module-name = "spaceknife_sdk"

[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"
