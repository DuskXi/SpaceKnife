app = "snap"
note = "软件包"
cleanup = "tool"
command = "sudo snap set system refresh.retain=2"
reason = "Snap 应用的软件包文件，默认保留旧版本以便回退。用 sudo snap set system refresh.retain=2 减少保留的版本数，用 snap remove --revision 删除指定的旧版本。"
platforms = "linux"
node = "dir"
paths = ["/var/lib/snapd/snaps"]
priority = 5
i18n.en.title = "Snap packages"
i18n.en.note = "Packages"
i18n.en.reason = "Package files of Snap applications; old revisions are kept for rollback. Keep fewer with sudo snap set system refresh.retain=2 and remove a specific old revision with snap remove --revision."

[[rule]]
id = "flatpak"
