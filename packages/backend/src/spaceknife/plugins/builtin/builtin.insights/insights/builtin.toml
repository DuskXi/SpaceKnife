i18n.en.note = "Device backup"
i18n.en.reason = "Local iPhone / iPad backups made with Finder, iTunes or the Apple Devices app, possibly tens of GB each. Once they are no longer needed, delete them under Manage Backups there, which shows which device and date each backup belongs to."

[[rule]]
