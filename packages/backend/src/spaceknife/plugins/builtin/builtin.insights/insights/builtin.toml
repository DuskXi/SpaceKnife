kind = "system"
title = "Windows 更新下载缓存"
app = "Windows 更新"
note = "系统更新"
cleanup = "tool"
reason = "Windows 更新下载的安装包，更新装好后通常不再需要。用「磁盘清理 › 清理系统文件 › Windows 更新清理」或存储感知清理；手动删除前要先停止 Windows Update 服务。"
platforms = "windows"
