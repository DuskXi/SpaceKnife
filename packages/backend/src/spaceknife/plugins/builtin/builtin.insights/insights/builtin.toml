note = "应用与运行时"
cleanup = "tool"
command = "flatpak uninstall --unused"
reason = "Flatpak 应用与共享运行时。用 flatpak uninstall --unused 删除不再被任何应用使用的运行时。"
platforms = "linux"
node = "dir"
paths = ["/var/lib/flatpak", ".local/share/flatpak"]
priority = 5
i18n.en.title = "Flatpak apps and runtimes"
i18n.en.note = "Apps and runtimes"
i18n.en.reason = "Flatpak applications and shared runtimes. flatpak uninstall --unused removes runtimes no application uses any more."

