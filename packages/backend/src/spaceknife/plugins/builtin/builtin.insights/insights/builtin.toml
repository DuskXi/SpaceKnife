platforms = "macos"
node = "dir"
names = ["*.photoslibrary"]
priority = 5
i18n.en.title = "Photos library"
i18n.en.app = "Photos"
i18n.en.note = "Photos library"
i18n.en.reason = "The Photos app library with every photo, video and edit. Do not change its contents in Finder; delete photos in Photos, or turn on Optimize Mac Storage."

[[rule]]
id = "outlook-ost"
kind = "app"
title = "Outlook 离线邮箱"
app = "Outlook"
note = "离线邮箱"
cleanup = "review"
reason = "Outlook 为 Exchange / Microsoft 365 邮箱保存的离线副本（.ost）。退出 Outlook 后删除，下次启动会重新同步；在账户设置里缩短「脱机保留邮件」的时长可以让它变小。.pst 是本地存档，不要删除。"
platforms = "windows"
node = "file"
paths = ["AppData/Local/Microsoft/Outlook/*.ost"]
i18n.en.title = "Outlook offline mailbox"
i18n.en.note = "Offline mailbox"
i18n.en.reason = "Outlook's offline copy (.ost) of an Exchange / Microsoft 365 mailbox. If deleted with Outlook closed it is synced again on the next start; a shorter Mail to keep offline setting makes it smaller. .pst files are local archives: do not delete them."

[[rule]]
id = "snap-packages"
