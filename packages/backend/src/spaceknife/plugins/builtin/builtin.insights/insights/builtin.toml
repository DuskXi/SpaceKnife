reason = "恢复或更新设备时下载的 iOS / iPadOS 固件（.ipsw）。更新完成后可以删除。"
paths = ["{Library/iTunes,AppData/Roaming/Apple Computer/iTunes}/{iPhone,iPad} Software Updates"]
i18n.en.title = "iOS firmware files"
i18n.en.app = "Finder / iTunes"
i18n.en.note = "Firmware download"
i18n.en.reason = "iOS / iPadOS firmware (.ipsw) downloaded to restore or update a device. It can be deleted once the update is done."

[[rule]]
