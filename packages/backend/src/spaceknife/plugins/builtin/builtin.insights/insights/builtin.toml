i18n.en.title = "Windows Update download cache"
i18n.en.app = "Windows Update"
i18n.en.note = "System update"
i18n.en.reason = "Packages downloaded by Windows Update, usually not needed once the update is installed. Clean them with Disk Cleanup › Clean up system files › Windows Update Cleanup or Storage Sense; stop the Windows Update service before deleting by hand."

[[rule]]
id = "software-distribution"
kind = "system"
title = "Windows 更新数据"
app = "Windows 更新"
note = "系统更新"
cleanup = "keep"
reason = "Windows 更新的下载缓存与更新历史数据库。不要整个删除；其中的下载缓存可以用「磁盘清理」清理。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows/SoftwareDistribution"]
priority = 10
i18n.en.title = "Windows Update data"
i18n.en.app = "Windows Update"
i18n.en.note = "System update"
i18n.en.reason = "Windows Update's download cache and update history database. Do not delete it as a whole; the download cache inside can be cleaned with Disk Cleanup."

[[rule]]
id = "delivery-optimization"
kind = "system"
title = "传递优化缓存"
app = "Windows 更新"
note = "更新分享缓存"
cleanup = "tool"
reason = "Windows 传递优化缓存：用来与局域网或互联网上的其他电脑分享更新。用「磁盘清理 › 传递优化文件」清理是安全的。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows/ServiceProfiles/NetworkService/AppData/Local/Microsoft/Windows/DeliveryOptimization"]
priority = 10
i18n.en.title = "Delivery Optimization cache"
i18n.en.app = "Windows Update"
i18n.en.note = "Update sharing cache"
i18n.en.reason = "The Windows Delivery Optimization cache, used to share updates with other PCs on the network or the internet. Cleaning it with Disk Cleanup › Delivery Optimization Files is safe."

[[rule]]
id = "windows-old"
kind = "system"
title = "旧版 Windows 备份"
note = "系统升级"
cleanup = "tool"
reason = "升级或重装 Windows 时保留的上一版本系统，用于回退，通常在一段时间后自动删除。确认不再回退后，在「设置 › 系统 › 存储 › 临时文件 › 以前的 Windows 安装」中删除；它受系统权限保护，很难手动删除。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows.old"]
priority = 10
i18n.en.title = "Previous Windows installation"
i18n.en.note = "System upgrade"
i18n.en.reason = "The previous Windows installation kept after an upgrade or reinstall so you can go back; Windows removes it automatically after a while. Once you will not go back, delete it under Settings › System › Storage › Temporary files › Previous Windows installation(s); its permissions make manual deletion hard."

[[rule]]
id = "hiberfil"
kind = "system"
title = "休眠文件"
note = "休眠文件"
cleanup = "keep"
command = "powercfg /hibernate off"
reason = "Windows 休眠和快速启动用来保存内存内容的文件，通常约为内存容量的 40%。不能直接删除；如果不需要休眠和快速启动，用管理员命令 powercfg /hibernate off 关闭后它会自动删除。"
platforms = "windows"
node = "file"
paths = ["?:/hiberfil.sys"]
priority = 10
i18n.en.title = "Hibernation file"
i18n.en.note = "Hibernation file"
i18n.en.reason = "The file Windows hibernation and Fast Startup save memory into, usually about 40% of the installed RAM. It cannot be deleted directly; if you need neither, running powercfg /hibernate off as administrator turns them off and removes it."

[[rule]]
id = "pagefile"
kind = "system"
title = "虚拟内存分页文件"
note = "虚拟内存"
cleanup = "keep"
reason = "Windows 的虚拟内存分页文件（swapfile.sys 用于应用的挂起与恢复）。不能直接删除；可以在「系统属性 › 高级 › 性能 › 虚拟内存」中调整大小或换到其他磁盘，关闭它可能让程序因内存不足而崩溃。"
platforms = "windows"
node = "file"
paths = ["?:/{pagefile,swapfile}.sys"]
priority = 10
i18n.en.title = "Virtual memory paging file"
i18n.en.note = "Virtual memory"
i18n.en.reason = "Windows' virtual memory paging file (swapfile.sys serves suspending and resuming apps). It cannot be deleted directly; resize it or move it to another drive under System Properties › Advanced › Performance › Virtual memory. Turning it off can crash programs that run out of memory."

[[rule]]
id = "winsxs"
kind = "system"
title = "Windows 组件存储"
note = "系统组件"
cleanup = "keep"
command = "DISM /Online /Cleanup-Image /StartComponentCleanup"
reason = "Windows 组件存储（WinSxS），保存系统组件及其旧版本。其中大量文件是指向系统目录的硬链接，实际占用比看上去小。不能手动删除；用 DISM /Online /Cleanup-Image /StartComponentCleanup 清理被替换的旧版本。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows/WinSxS"]
priority = 10
i18n.en.title = "Windows component store"
i18n.en.note = "System components"
i18n.en.reason = "The Windows component store (WinSxS) with system components and their older versions. Many files are hard links into the system folders, so it occupies less than it seems. Never delete by hand; DISM /Online /Cleanup-Image /StartComponentCleanup removes superseded versions."

[[rule]]
id = "windows-installer-cache"
kind = "system"
title = "Windows Installer 缓存"
note = "安装程序缓存"
cleanup = "keep"
reason = "已安装程序的 .msi / .msp 安装包副本，修复、更新和卸载这些程序时需要。不要手动删除，否则这些程序可能无法卸载或更新。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows/Installer"]
priority = 10
i18n.en.title = "Windows Installer cache"
i18n.en.note = "Installer cache"
i18n.en.reason = "Copies of the .msi / .msp packages of installed programs, needed to repair, update and uninstall them. Do not delete them by hand, or those programs may become impossible to uninstall or update."

[[rule]]
id = "package-cache"
kind = "system"
title = "安装程序包缓存"
note = "安装程序缓存"
cleanup = "keep"
reason = "Visual Studio、.NET、VC++ 运行库等安装程序保留的安装包，修复、更新和卸载时需要。不建议手动删除。"
platforms = "windows"
node = "dir"
paths = ["?:/ProgramData/Package Cache"]
priority = 10
i18n.en.title = "Installer package cache"
i18n.en.note = "Installer cache"
i18n.en.reason = "Packages kept by installers such as Visual Studio, .NET and the VC++ runtimes, needed to repair, update and uninstall them. Deleting them by hand is not recommended."

[[rule]]
id = "windowsapps"
kind = "system"
title = "Microsoft Store 应用"
note = "商店应用"
cleanup = "keep"
reason = "Microsoft Store 应用和部分游戏的安装目录，受系统保护，不能直接删除。在「设置 › 应用 › 已安装的应用」中卸载或移动。"
platforms = "windows"
node = "dir"
paths = ["?:/Program Files/WindowsApps", "?:/WindowsApps"]
priority = 10
i18n.en.title = "Microsoft Store apps"
i18n.en.note = "Store apps"
i18n.en.reason = "Where Microsoft Store apps and some games are installed; protected by the system and not deletable directly. Uninstall or move them in Settings › Apps › Installed apps."

[[rule]]
id = "system-volume-information"
kind = "system"
title = "系统还原点与卷影副本"
note = "还原点"
cleanup = "tool"
reason = "系统还原点、卷影副本等系统数据，受保护无法直接访问。在「系统属性 › 系统保护 › 配置」中调整最大使用量或删除还原点。"
platforms = "windows"
node = "dir"
paths = ["?:/System Volume Information"]
priority = 10
i18n.en.title = "Restore points and shadow copies"
i18n.en.note = "Restore points"
i18n.en.reason = "System restore points, shadow copies and other protected system data. Adjust the maximum usage or delete restore points under System Properties › System Protection › Configure."

[[rule]]
id = "recycle-bin"
kind = "system"
title = "回收站"
note = "回收站"
cleanup = "tool"
reason = "已删除、但还在回收站里的文件。清空回收站即可释放这些空间。"
node = "dir"
paths = ["?:/$Recycle.Bin", ".local/share/Trash", "/Users/*/.Trash", ".Trash-*"]
priority = 5
i18n.en.title = "Recycle Bin"
i18n.en.note = "Recycle Bin"
i18n.en.reason = "Deleted files still in the Recycle Bin / Trash. Empty it to free the space."

[[rule]]
id = "windows-temp"
kind = "cache"
title = "临时文件"
note = "临时文件"
cleanup = "safe"
reason = "系统和程序的临时文件，一般可以删除；正在使用的文件会删除失败，跳过即可。用「设置 › 系统 › 存储 › 临时文件」或存储感知清理更方便。"
platforms = "windows"
node = "dir"
paths = ["?:/Windows/Temp", "AppData/Local/Temp"]
i18n.en.title = "Temporary files"
i18n.en.note = "Temporary files"
i18n.en.reason = "Temporary files of the system and programs; they can generally be deleted, and files in use simply fail to delete. Settings › System › Storage › Temporary files or Storage Sense is the convenient way."

[[rule]]
id = "explorer-thumbcache"
kind = "cache"
title = "缩略图缓存"
note = "缩略图缓存"
cleanup = "safe"
reason = "资源管理器的缩略图和图标缓存（thumbcache_*.db）。可以用「磁盘清理 › 缩略图」安全清理，之后浏览文件夹时会重新生成。"
platforms = "windows"
node = "dir"
paths = ["AppData/Local/Microsoft/Windows/Explorer"]
i18n.en.title = "Thumbnail cache"
i18n.en.note = "Thumbnail cache"
i18n.en.reason = "File Explorer's thumbnail and icon caches (thumbcache_*.db). Disk Cleanup › Thumbnails removes them safely; they are rebuilt as you browse folders."

[[rule]]
id = "driver-installers"
kind = "cache"
title = "显卡驱动安装包"
note = "驱动安装包"
cleanup = "safe"
reason = "显卡驱动安装程序解压或下载的安装包。驱动装好后不再需要，可以删除。"
platforms = "windows"
node = "dir"
paths = ["?:/{AMD,NVIDIA}", "?:/ProgramData/NVIDIA Corporation/Downloader"]
i18n.en.title = "Graphics driver installers"
i18n.en.note = "Driver installers"
i18n.en.reason = "Packages graphics driver installers extracted or downloaded. They are not needed once the driver is installed and can be deleted."

[[rule]]
id = "crash-dumps"
kind = "system"
title = "崩溃转储"
note = "崩溃转储"
cleanup = "safe"
reason = "程序或系统崩溃时保存的内存转储与诊断报告，用于排查问题。不需要排查时可以删除。"
paths = [
  "AppData/Local/CrashDumps", "?:/Windows/{Minidump,MEMORY.DMP,LiveKernelReports}",
  "/var/crash", "/var/lib/systemd/coredump", "Library/Logs/DiagnosticReports",
]
i18n.en.title = "Crash dumps"
i18n.en.note = "Crash dumps"
i18n.en.reason = "Memory dumps and diagnostic reports saved when a program or the system crashed, used for troubleshooting. They can be deleted if you are not investigating a crash."

# ============================================================================================
# 系统：Linux / macOS（system / cache）
# ============================================================================================

[[rule]]
id = "linux-swapfile"
kind = "system"
title = "交换文件"
note = "虚拟内存"
cleanup = "keep"
reason = "Linux 的交换文件（虚拟内存）。不要直接删除；需要先用 swapoff 停用，并从 /etc/fstab 中去掉对应的行。"
platforms = "linux"
node = "file"
paths = ["/swapfile", "/swap.img", "/swap/swapfile"]
priority = 10
i18n.en.title = "Swap file"
i18n.en.note = "Virtual memory"
i18n.en.reason = "The Linux swap file (virtual memory). Do not delete it directly: turn it off with swapoff and remove its line from /etc/fstab first."

[[rule]]
id = "macos-swap"
kind = "system"
title = "交换与休眠文件"
note = "虚拟内存"
cleanup = "keep"
reason = "macOS 的交换文件和休眠镜像（sleepimage），由系统管理，大小随内存压力变化，不能手动删除；重启后通常会变小。"
platforms = "macos"
paths = ["/private/var/vm", "/System/Volumes/VM"]
priority = 10
i18n.en.title = "Swap and sleep image"
i18n.en.note = "Virtual memory"
i18n.en.reason = "macOS swap files and the sleep image, managed by the system and sized by memory pressure; do not delete them by hand. A restart usually makes them smaller."

[[rule]]
id = "macos-var-folders"
kind = "system"
title = "系统临时与缓存目录"
note = "系统缓存"
cleanup = "keep"
reason = "macOS 为每个用户维护的临时文件与缓存，由系统定期清理。不要手动删除，重启通常会释放一部分空间。"
platforms = "macos"
node = "dir"
paths = ["/private/var/folders"]
priority = 10
i18n.en.title = "System temporary and cache folders"
i18n.en.note = "System cache"
i18n.en.reason = "Per-user temporary files and caches macOS maintains and cleans periodically. Do not delete them by hand; a restart usually frees some of the space."

[[rule]]
id = "apt-cache"
kind = "cache"
title = "APT 软件包缓存"
app = "APT"
note = "软件包缓存"
cleanup = "safe"
command = "sudo apt clean"
reason = "apt 下载的 .deb 安装包，软件装好后不再需要。用 sudo apt clean 清理。"
platforms = "linux"
node = "dir"
paths = ["/var/cache/apt/archives"]
i18n.en.title = "APT package cache"
i18n.en.note = "Package cache"
i18n.en.reason = ".deb packages apt downloaded, not needed once the software is installed. Clean them with sudo apt clean."

[[rule]]
id = "dnf-cache"
kind = "cache"
title = "DNF / YUM 软件包缓存"
app = "DNF"
note = "软件包缓存"
cleanup = "safe"
command = "sudo dnf clean all"
reason = "dnf、yum 或 PackageKit 下载的 RPM 包与仓库元数据缓存。用 sudo dnf clean all 清理。"
platforms = "linux"
node = "dir"
paths = ["/var/cache/{dnf,yum,PackageKit}"]
i18n.en.title = "DNF / YUM package cache"
i18n.en.note = "Package cache"
i18n.en.reason = "RPM packages and repository metadata cached by dnf, yum or PackageKit. Clean them with sudo dnf clean all."

[[rule]]
id = "journal-logs"
kind = "system"
title = "systemd 日志"
note = "系统日志"
cleanup = "tool"
command = "sudo journalctl --vacuum-size=200M"
reason = "systemd-journald 保存的系统日志。不要直接删除正在写入的日志；用 sudo journalctl --vacuum-size=200M 压缩到指定大小。"
platforms = "linux"
node = "dir"
paths = ["/var/log/journal"]
i18n.en.title = "systemd journal"
i18n.en.note = "System logs"
i18n.en.reason = "System logs kept by systemd-journald. Do not delete the active journal files; shrink it to a given size with sudo journalctl --vacuum-size=200M."

[[rule]]
id = "posix-temp"
kind = "cache"
title = "临时目录"
note = "临时文件"
cleanup = "review"
reason = "系统临时目录，/tmp 通常在重启时清空。不要删除正在运行的程序使用的文件。"
platforms = "posix"
node = "dir"
paths = ["/tmp", "/var/tmp", "/private/tmp", "/private/var/tmp"]
i18n.en.title = "Temporary folder"
i18n.en.note = "Temporary files"
i18n.en.reason = "A system temporary folder; /tmp is usually emptied at restart. Do not delete files that running programs are using."

[[rule]]
id = "xdg-cache"
kind = "cache"
title = "用户缓存目录"
note = "应用缓存"
cleanup = "review"
reason = "Linux 程序存放缓存的标准位置（XDG）。其中大多数内容可以删除，程序会重新生成；先看看是哪个程序的子目录占用最多。"
platforms = "linux"
node = "dir"
paths = ["/home/*/.cache", "/root/.cache"]
priority = -5
i18n.en.title = "User cache folder"
i18n.en.note = "App caches"
i18n.en.reason = "The standard (XDG) place where Linux programs keep caches. Most of it can be deleted and is regenerated; look at which program's subfolder is largest first."

[[rule]]
id = "macos-caches"
kind = "cache"
title = "应用缓存"
note = "应用缓存"
cleanup = "review"
reason = "macOS 应用存放缓存的位置。多数子目录可以在退出对应应用后删除，会自动重建；先看看是哪个应用的子目录占用最多。"
platforms = "macos"
node = "dir"
paths = ["Library/Caches"]
priority = -5
i18n.en.title = "App caches"
i18n.en.note = "App caches"
i18n.en.reason = "Where macOS apps keep their caches. Most subfolders can be deleted once the app is closed and are rebuilt automatically; look at which app's subfolder is largest first."
