# SpaceKnife 内置洞察规则（格式见 docs/insights.md）。
#
# 优先级分档：10 系统文件 · 5 应用 / 虚拟机 / 游戏 / 聊天数据的整个目录（里面的内容都归它）
# · 1 开发依赖容器（node_modules、虚拟环境、.git）· 0 默认 · -5 宽泛的容器与通用文件类型
# · -10 通用的构建目录名（build、dist、target）。
# 同一优先级时离得最近（最深）的匹配优先，再按模式的具体程度。
# 文案：title / note / reason 为简体中文，i18n.en 为英文；说明它是什么、能否清理、怎样清理。

version = 1

# ============================================================================================
# 虚拟机与容器（vm）
# ============================================================================================

[[rule]]
id = "docker-desktop"
kind = "vm"
title = "Docker Desktop 虚拟磁盘"
app = "Docker Desktop"
note = "Docker 数据"
cleanup = "tool"
command = "docker system prune"
reason = "Docker Desktop 的镜像、容器、卷和构建缓存都存放在这里的 vhdx 虚拟磁盘中。删除镜像或容器后 vhdx 不会自动缩小，先在 Docker Desktop 中清理，再压缩虚拟磁盘；直接删除 vhdx 会丢失全部镜像和容器。"
platforms = "windows"
paths = ["AppData/Local/Docker", "?:/ProgramData/DockerDesktop"]
priority = 5
i18n.en.title = "Docker Desktop virtual disk"
i18n.en.note = "Docker data"
i18n.en.reason = "Docker Desktop keeps images, containers, volumes and build cache inside the .vhdx virtual disks here. The disk does not shrink when you delete images or containers: clean up in Docker Desktop first, then compact the virtual disk. Deleting the .vhdx loses every image and container."

[[rule]]
id = "docker-desktop-mac"
kind = "vm"
title = "Docker Desktop 虚拟磁盘"
app = "Docker Desktop"
note = "Docker 数据"
cleanup = "tool"
command = "docker system prune"
reason = "Docker Desktop 的镜像、容器和卷都在 Docker.raw 虚拟磁盘里。它是稀疏文件，访达显示的大小可能远大于实际占用；用 docker system prune 清理，或在「设置 › 资源」中调小磁盘上限。"
platforms = "macos"
paths = ["Library/Containers/com.docker.docker"]
priority = 5
i18n.en.title = "Docker Desktop virtual disk"
i18n.en.note = "Docker data"
i18n.en.reason = "Docker Desktop keeps images, containers and volumes in the Docker.raw virtual disk. It is a sparse file, so Finder may show far more than it really occupies; clean up with docker system prune, or lower the disk limit in Settings › Resources."

[[rule]]
id = "container-engine"
kind = "vm"
title = "容器引擎数据"
app = "Docker / Podman"
note = "容器数据"
cleanup = "tool"
command = "docker system prune"
reason = "Docker、containerd 或 Podman 的镜像层、容器和卷。不要直接删除这里的文件，否则容器引擎会损坏；用 docker system prune（Podman：podman system prune）清理不再使用的镜像和容器。"
platforms = "linux"
paths = ["/var/lib/{docker,containerd,containers}", ".local/share/{docker,containers}"]
priority = 5
i18n.en.title = "Container engine data"
i18n.en.note = "Container data"
i18n.en.reason = "Image layers, containers and volumes of Docker, containerd or Podman. Deleting files here directly corrupts the engine; use docker system prune (Podman: podman system prune) to remove unused images and containers."

[[rule]]
id = "wsl-distro-disk"
kind = "vm"
title = "WSL 发行版虚拟磁盘"
app = "WSL"
note = "WSL 磁盘"
cleanup = "tool"
command = "wsl --shutdown"
reason = "一个 WSL 发行版的整个 Linux 文件系统。在发行版里删除文件后 vhdx 不会自动缩小，可以先 wsl --shutdown 再压缩，或开启稀疏模式；直接删除会丢失该发行版的全部数据，不用的发行版用 wsl --unregister 移除。"
platforms = "windows"
node = "file"
names = ["ext4.vhdx"]
i18n.en.title = "WSL distribution virtual disk"
i18n.en.note = "WSL disk"
i18n.en.reason = "The whole Linux file system of one WSL distribution. The .vhdx does not shrink when you delete files inside it: run wsl --shutdown and compact it, or enable sparse mode. Deleting it loses everything in that distribution; remove a distribution you no longer use with wsl --unregister."

[[rule]]
id = "hyperv-vms"
kind = "vm"
title = "Hyper-V 虚拟机"
app = "Hyper-V"
note = "虚拟机"
cleanup = "tool"
reason = "Hyper-V 虚拟机的虚拟磁盘与配置。在 Hyper-V 管理器中删除虚拟机不会删除磁盘文件，确认不再使用后再删除；.avhdx 是检查点，要在管理器里删除或合并，不要直接删。"
platforms = "windows"
paths = ["Users/Public/Documents/Hyper-V", "?:/ProgramData/Microsoft/Windows/{Hyper-V,Virtual Hard Disks}"]
priority = 5
i18n.en.title = "Hyper-V virtual machines"
i18n.en.note = "Virtual machine"
i18n.en.reason = "Virtual disks and configuration of Hyper-V virtual machines. Deleting a VM in Hyper-V Manager leaves its disks behind; delete them once you are sure they are unused. .avhdx files are checkpoints: delete or merge them in the manager, not by hand."

[[rule]]
id = "virtualbox-vms"
kind = "vm"
title = "VirtualBox 虚拟机"
app = "VirtualBox"
note = "虚拟机"
cleanup = "tool"
reason = "VirtualBox 虚拟机的虚拟磁盘（.vdi 等）、快照和日志。在 VirtualBox 中选择「删除 › 删除所有文件」可以连同磁盘一起移除；快照请在快照管理里删除。"
paths = ["VirtualBox VMs"]
priority = 5
i18n.en.title = "VirtualBox virtual machines"
i18n.en.note = "Virtual machine"
i18n.en.reason = "Virtual disks (.vdi and others), snapshots and logs of VirtualBox machines. Remove a machine together with its disks with Remove › Delete all files in VirtualBox; delete snapshots in the snapshot manager."

[[rule]]
id = "vmware-vms"
kind = "vm"
title = "VMware 虚拟机"
app = "VMware"
note = "虚拟机"
cleanup = "tool"
reason = "VMware Workstation / Fusion 虚拟机的虚拟磁盘（.vmdk）、快照和内存文件。在 VMware 中用「从磁盘中删除」整台移除；快照请在快照管理器里删除，不要直接删文件。"
paths = ["Documents/Virtual Machines", "Virtual Machines.localized", "/home/*/vmware"]
priority = 5
i18n.en.title = "VMware virtual machines"
i18n.en.note = "Virtual machine"
i18n.en.reason = "Virtual disks (.vmdk), snapshots and memory files of VMware Workstation / Fusion machines. Remove a whole machine with Delete from Disk in VMware; delete snapshots in the snapshot manager, not by deleting files."

[[rule]]
id = "parallels-vms"
kind = "vm"
title = "Parallels 虚拟机"
app = "Parallels Desktop"
note = "虚拟机"
cleanup = "tool"
reason = "Parallels Desktop 的虚拟机包，里面是虚拟磁盘与快照。在 Parallels 控制中心删除虚拟机，或用「回收磁盘空间」缩小虚拟磁盘。"
platforms = "macos"
paths = ["/Users/*/Parallels"]
names = ["*.pvm"]
priority = 5
i18n.en.title = "Parallels virtual machines"
i18n.en.note = "Virtual machine"
i18n.en.reason = "Parallels Desktop virtual machine bundles holding virtual disks and snapshots. Delete a machine in Parallels Control Center, or shrink its disk with Reclaim disk space."

[[rule]]
id = "utm-vms"
kind = "vm"
title = "UTM 虚拟机"
app = "UTM"
note = "虚拟机"
cleanup = "tool"
reason = "UTM 虚拟机包，里面是虚拟磁盘（qcow2）。在 UTM 中删除虚拟机即可释放空间。"
platforms = "macos"
paths = ["Library/Containers/com.utmapp.UTM"]
names = ["*.utm"]
priority = 5
i18n.en.title = "UTM virtual machines"
i18n.en.note = "Virtual machine"
i18n.en.reason = "UTM virtual machine bundles holding qcow2 virtual disks. Delete the machine in UTM to free the space."

[[rule]]
id = "virtual-disk-file"
kind = "vm"
title = "虚拟磁盘文件"
note = "虚拟磁盘"
cleanup = "review"
reason = "虚拟机或容器使用的虚拟磁盘镜像。先确认是哪个虚拟机在用：直接删除会丢失其中的全部数据，正在使用的磁盘也无法删除。"
node = "file"
names = ["*.{vhdx,vhd,avhdx,vmdk,vdi,qcow2}"]
priority = -5
i18n.en.title = "Virtual disk file"
i18n.en.note = "Virtual disk"
i18n.en.reason = "A virtual disk image used by a virtual machine or container. Find out which machine uses it first: deleting it loses everything inside, and a disk in use cannot be deleted."

[[rule]]
id = "android-avd"
kind = "vm"
title = "Android 模拟器"
app = "Android Studio"
note = "模拟器"
cleanup = "tool"
reason = "Android 模拟器（AVD）的系统镜像副本与用户数据，每台通常有几 GB。在 Android Studio 的 Device Manager 中删除不用的设备，或用「Wipe Data」清空数据。"
paths = [".android/avd"]
priority = 5
i18n.en.title = "Android emulators"
i18n.en.note = "Emulator"
i18n.en.reason = "System image copies and user data of Android emulators (AVDs), often several GB each. Delete devices you no longer use in Android Studio's Device Manager, or Wipe Data to empty one."

[[rule]]
id = "ios-simulators"
kind = "vm"
title = "iOS 模拟器"
app = "Xcode"
note = "模拟器"
cleanup = "tool"
command = "xcrun simctl delete unavailable"
reason = "Xcode 各个模拟器设备的数据。用 xcrun simctl delete unavailable 删除已失效的设备，在 Xcode 的「设备与模拟器」里删除不用的模拟器。"
platforms = "macos"
paths = ["Library/Developer/CoreSimulator/Devices"]
priority = 5
i18n.en.title = "iOS simulators"
i18n.en.note = "Simulator"
i18n.en.reason = "Data of Xcode's simulator devices. xcrun simctl delete unavailable removes devices of runtimes that are gone; delete simulators you no longer use in Xcode's Devices and Simulators window."

# ============================================================================================
# 开发：依赖与构建输出（build）
# ============================================================================================

[[rule]]
id = "node-modules"
kind = "build"
title = "node_modules 依赖目录"
app = "Node.js"
note = "依赖安装"
cleanup = "safe"
reason = "项目通过 npm / pnpm / yarn 安装的依赖包。删除是安全的，在项目里重新运行 npm install（或 pnpm / yarn install）即可恢复；不再开发的项目可以直接删掉。"
node = "dir"
names = ["node_modules"]
exclude = [
  "?:/{Program Files,Program Files (x86),ProgramData,Windows}/**", "AppData/Local/Programs/**",
  "AppData/Roaming/{npm,nvm}/**", "{.nvm,.npm-global,.volta,.fnm}/**", "pnpm/global/**",
  "{.npm,npm-cache}/**",
  "/{usr,opt,snap,Applications,System,Library}/**",
]
priority = 1
i18n.en.title = "node_modules dependencies"
i18n.en.note = "Dependency install"
i18n.en.reason = "Packages a project installed with npm / pnpm / yarn. Deleting is safe: run npm install (or pnpm / yarn install) in the project to restore them; for projects you no longer work on, simply delete it."

[[rule]]
id = "python-venv"
kind = "build"
title = "Python 虚拟环境"
app = "Python"
note = "虚拟环境"
cleanup = "safe"
reason = "项目的 Python 虚拟环境：安装的依赖包和一份解释器。可以删除，之后按项目的依赖文件重建（uv sync、pip install -r requirements.txt 等）；删除前确认没有手工装进去、又无处可查的包。"
node = "dir"
names = [".venv", "venv", ".tox", ".nox"]
exclude = [
  "?:/{Program Files,Program Files (x86),ProgramData,Windows}/**", "AppData/Local/Programs/**",
  "/{usr,opt,snap,Applications,System,Library}/**",
  "{Lib,lib}/venv", "{lib,lib64}/python*/venv",  # the standard library's own venv package
]
priority = 1
i18n.en.title = "Python virtual environment"
i18n.en.note = "Virtual environment"
i18n.en.reason = "A project's Python virtual environment: installed packages and a copy of the interpreter. It can be deleted and rebuilt from the project's dependency files (uv sync, pip install -r requirements.txt …); make sure nothing was installed into it by hand without a record."

[[rule]]
id = "conda-env"
kind = "build"
title = "conda 环境"
app = "conda"
note = "conda 环境"
cleanup = "tool"
command = "conda env remove -n <环境名>"
reason = "一个 conda 环境：解释器与安装的包。不用的环境用 conda env remove 删除，比直接删目录更干净（conda 会同时更新环境列表）。"
node = "dir"
paths = ["{anaconda3,miniconda3,miniforge3,mambaforge,.conda}/envs/*"]
priority = 1
i18n.en.title = "conda environment"
i18n.en.note = "conda environment"
i18n.en.reason = "A conda environment: an interpreter and its packages. Remove environments you no longer use with conda env remove rather than deleting the folder, so conda's environment list stays correct."

[[rule]]
id = "conda-pkgs"
kind = "cache"
title = "conda 包缓存"
app = "conda"
note = "包缓存"
cleanup = "tool"
command = "conda clean --all"
reason = "conda 下载并解压的包缓存。各环境通过硬链接共享这些文件，所以这里的大小可能和环境重复计算；用 conda clean --all 清理不再被引用的包。"
paths = ["{anaconda3,miniconda3,miniforge3,mambaforge,.conda}/pkgs"]
i18n.en.title = "conda package cache"
i18n.en.note = "Package cache"
i18n.en.reason = "Packages conda downloaded and extracted. Environments share these files through hard links, so this size may overlap with the environments; conda clean --all removes the packages nothing uses any more."

[[rule]]
id = "pycache"
kind = "build"
title = "Python 字节码缓存"
note = "字节码缓存"
cleanup = "safe"
reason = "Python 自动生成的 .pyc 字节码缓存。删除是安全的，下次运行时会重新生成。"
node = "dir"
names = ["__pycache__"]
priority = -5
i18n.en.title = "Python bytecode cache"
i18n.en.note = "Bytecode cache"
i18n.en.reason = "Compiled .pyc files Python writes automatically. Deleting is safe; they are regenerated on the next run."

[[rule]]
id = "dev-tool-caches"
kind = "build"
title = "开发工具缓存"
note = "工具缓存"
cleanup = "safe"
reason = "代码检查、测试或打包工具（mypy、pytest、ruff、Hypothesis、Parcel、Turborepo、ESLint）的本地缓存。删除是安全的，工具下次运行时会重建，只是第一次会慢一些。"
names = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".hypothesis", ".parcel-cache", ".turbo", ".eslintcache"]
i18n.en.title = "Developer tool cache"
i18n.en.note = "Tool cache"
i18n.en.reason = "Local caches of linters, test runners and bundlers (mypy, pytest, ruff, Hypothesis, Parcel, Turborepo, ESLint). Deleting is safe; the tool rebuilds it on its next run, which is slower once."

[[rule]]
id = "js-framework-build"
kind = "build"
title = "前端框架构建输出"
note = "构建输出"
cleanup = "safe"
reason = "Next.js、Nuxt、SvelteKit、Vite、Docusaurus、Angular 等前端框架生成的构建产物与缓存。删除是安全的，下次 dev / build 时会重新生成。"
node = "dir"
names = [".next", ".nuxt", ".svelte-kit", ".vite", ".docusaurus", ".angular"]
i18n.en.title = "Front-end framework build output"
i18n.en.note = "Build output"
i18n.en.reason = "Build output and caches of front-end frameworks (Next.js, Nuxt, SvelteKit, Vite, Docusaurus, Angular). Deleting is safe; the next dev or build run regenerates it."

[[rule]]
id = "visual-studio-cache"
kind = "build"
title = "Visual Studio 解决方案缓存"
app = "Visual Studio"
note = "IDE 缓存"
cleanup = "safe"
reason = "Visual Studio 为解决方案保存的 IntelliSense 数据库、预编译头（ipch）和浏览信息，可能有几 GB。关闭 Visual Studio 后删除是安全的，下次打开时会重建（窗口布局和断点等会丢失）。"
node = "dir"
names = [".vs", "ipch"]
i18n.en.title = "Visual Studio solution cache"
i18n.en.note = "IDE cache"
i18n.en.reason = "IntelliSense databases, precompiled headers (ipch) and browse data Visual Studio keeps per solution, sometimes several GB. Deleting it with Visual Studio closed is safe; it is rebuilt on the next open (window layout and breakpoints are lost)."

[[rule]]
id = "cargo-target"
kind = "build"
title = "构建输出（target）"
note = "构建输出"
cleanup = "review"
command = "cargo clean"
reason = "通常是 Rust（cargo）或 Maven 的构建输出：编译产物和增量缓存，常有几 GB。确认是构建目录后可以删除（cargo clean / mvn clean），下次构建时会重新生成；这个名字比较通用，删除前请确认。"
node = "dir"
names = ["target"]
exclude = ["?:/{Program Files,Program Files (x86),ProgramData,Windows}/**", "AppData/Local/Programs/**", "/{usr,opt,snap,Applications,System,Library,etc,proc,sys}/**"]
priority = -10
i18n.en.title = "Build output (target)"
i18n.en.note = "Build output"
i18n.en.reason = "Usually the build output of Rust (cargo) or Maven: compiled artifacts and incremental caches, often several GB. Once you are sure it is a build folder it can be deleted (cargo clean / mvn clean) and is rebuilt on the next build; the name is generic, so check first."

[[rule]]
id = "build-output"
kind = "build"
title = "构建输出"
note = "构建输出"
cleanup = "review"
reason = "名称表明这里可能是构建工具（CMake、Gradle、webpack、setuptools 等）生成的产物，通常可以删除后重新构建。这个名字比较通用，删除前请确认它确实是构建目录，而不是源文件或安装好的程序。"
node = "dir"
names = ["build", "dist", "cmake-build-*"]
exclude = ["?:/{Program Files,Program Files (x86),ProgramData,Windows}/**", "AppData/Local/Programs/**", "/{usr,opt,snap,Applications,System,Library,etc,proc,sys,boot}/**"]
priority = -10
i18n.en.title = "Build output"
i18n.en.note = "Build output"
i18n.en.reason = "The name suggests output of a build tool (CMake, Gradle, webpack, setuptools …), which can usually be deleted and rebuilt. The name is generic: make sure it really is a build folder and not sources or an installed program."

[[rule]]
id = "git-repo"
kind = "build"
title = "Git 仓库数据"
app = "Git"
note = "Git 历史"
cleanup = "keep"
command = "git gc"
reason = "Git 仓库的元数据与全部历史。删除后这个目录就不再是 Git 仓库，没有推送的提交和分支会丢失；想减小体积用 git gc。"
node = "dir"
names = [".git"]
priority = 1
i18n.en.title = "Git repository data"
i18n.en.note = "Git history"
i18n.en.reason = "The metadata and full history of a Git repository. Deleting it turns the folder into a plain folder and loses commits and branches that were not pushed; use git gc to make it smaller."

[[rule]]
id = "git-objects"
kind = "build"
title = "Git 对象库"
app = "Git"
note = "Git 历史"
cleanup = "keep"
command = "git gc"
reason = "Git 仓库的全部历史（提交与文件的各个版本）和 LFS 大文件。不要直接删除，否则仓库会损坏；用 git gc 压缩历史，用 git lfs prune 清理不再需要的 LFS 文件。"
paths = [".git/objects", ".git/lfs"]
priority = 1
i18n.en.title = "Git object store"
i18n.en.note = "Git history"
i18n.en.reason = "The full history of a Git repository (every commit and file version) and its LFS files. Deleting it corrupts the repository; compact the history with git gc and remove LFS files no longer needed with git lfs prune."

[[rule]]
id = "xcode-derived-data"
kind = "build"
title = "Xcode DerivedData"
app = "Xcode"
note = "构建缓存"
cleanup = "safe"
reason = "Xcode 的构建产物与索引。退出 Xcode 后删除是安全的，下次构建时会重新生成。"
platforms = "macos"
paths = ["Library/Developer/Xcode/DerivedData"]
i18n.en.title = "Xcode DerivedData"
i18n.en.note = "Build cache"
i18n.en.reason = "Xcode's build products and indexes. Deleting it with Xcode closed is safe; the next build regenerates it."

[[rule]]
id = "xcode-archives"
kind = "build"
title = "Xcode 归档"
app = "Xcode"
note = "应用归档"
cleanup = "review"
reason = "用 Xcode「Archive」打包的应用归档，包含调试符号（dSYM）。已发布版本的归档用于解析崩溃日志，确认不再需要后在 Xcode Organizer 中删除。"
platforms = "macos"
paths = ["Library/Developer/Xcode/Archives"]
i18n.en.title = "Xcode archives"
i18n.en.note = "App archives"
i18n.en.reason = "App archives made with Xcode's Archive, including debug symbols (dSYM). Archives of released versions are needed to symbolicate crash logs; delete them in Xcode's Organizer once they are no longer needed."

[[rule]]
id = "xcode-device-support"
kind = "cache"
title = "Xcode 设备支持文件"
app = "Xcode"
note = "调试符号缓存"
cleanup = "safe"
reason = "连接真机调试时从设备复制的系统符号，每个系统版本几 GB，以及模拟器的缓存。旧版本可以删除，再次连接该版本的设备时会重新复制。"
platforms = "macos"
paths = ["Library/Developer/Xcode/{iOS,watchOS,tvOS,visionOS} DeviceSupport", "Library/Developer/CoreSimulator/Caches"]
i18n.en.title = "Xcode device support files"
i18n.en.note = "Debug symbol cache"
i18n.en.reason = "System symbols copied from devices for on-device debugging, several GB per OS version, plus simulator caches. Old versions can be deleted; they are copied again when a device with that version is connected."

[[rule]]
id = "unity-project-cache"
kind = "build"
title = "Unity 项目缓存"
app = "Unity"
note = "导入缓存"
cleanup = "safe"
reason = "Unity 项目 Library 目录里的导入缓存、着色器缓存和编译产物。关闭 Unity 后删除是安全的，再次打开项目时会重新导入（大项目可能要很久）。"
node = "dir"
paths = ["Library/{PackageCache,ShaderCache,Bee,ScriptAssemblies,Artifacts,il2cpp_cache}"]
i18n.en.title = "Unity project cache"
