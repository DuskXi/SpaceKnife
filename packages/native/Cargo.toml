[package]
name = "spaceknife-native"
version = "0.1.0"
edition = "2024"
description = "Native acceleration for SpaceKnife: MFT parsing, parallel directory scans and duplicate-file reads"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["mft", "hardscan", "dupes"]
mft = []
hardscan = []
dupes = []

[dependencies]
blake3 = "1.8.7"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
rayon = "1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Wdk_System_SystemServices", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_Debug"] }
