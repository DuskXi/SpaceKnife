name: Scan benchmark

# Scan speed on GitHub's macOS runners (their own disks): the default against the settings before
# (listing threads, folders through fstatat), warm and with the disk cache purged
# (.github/scripts/scan-bench.sh).
# The numbers are in the job log; nothing is uploaded.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/scan-bench.yml
      - .github/scripts/scan-bench.sh
      - packages/native/src/hardscan/**
      - packages/backend/src/spaceknife/scan/scanner.py
      - packages/backend/src/spaceknife/io/**

permissions:
  contents: read

concurrency:
  group: scan-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0 # exact version: this action publishes no moving major tag
      - name: Install with the native extension
        run: uv sync --locked --group native
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sw_vers -productVersion
          diskutil info / | grep -E 'Device Node|Protocol|Solid State|Virtual|Personality' || true
      - name: Scan /System/Library /usr, warm
        env:
          SPACEKNIFE_HOME: ${{ runner.temp }}/spaceknife-home
          BENCH_CACHE: warm
          BENCH_ROUNDS: 6
        run: bash .github/scripts/scan-bench.sh /System/Library /usr
      - name: Scan /System/Library /usr, disk cache purged
        env:
          SPACEKNIFE_HOME: ${{ runner.temp }}/spaceknife-home
          BENCH_CACHE: cold
          BENCH_ROUNDS: 3
        run: bash .github/scripts/scan-bench.sh /System/Library /usr
