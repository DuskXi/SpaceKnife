name: CI

on:
  push:
    branches: [main, dev] # work happens on dev; main changes by merging dev
  pull_request:
  workflow_dispatch: # a manual run tests everything

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits a push or pull request is compared against

      # Pull request: its merge commit against the base it merges into. Push: the pushed commits.
      # A manual run, a new branch, or a force push whose old commit is gone runs everything.
      # The rules are in .github/scripts/ci-areas.sh.
      - name: Decide which jobs run
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          if [ -n "$base" ]; then
            git -c core.quotepath=off diff --name-only --no-renames "$base" HEAD > changed.txt
            areas=$(bash .github/scripts/ci-areas.sh < changed.txt)
          else
            echo "(everything)" > changed.txt
            areas=$'rust=true\ndesktop=true'
          fi
          echo "$areas" | tee -a "$GITHUB_OUTPUT"
          { echo "### Jobs to run"; echo; echo "$areas" | sed 's/^/- /'; echo; echo "Changed files:"; echo; echo '```'; cat changed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # a cold build and the suite take a while; a hang must not hold a runner for hours
    strategy:
      fail-fast: false
      matrix:
        # Platform floors from docs/PLAN.md: Windows 10+, Ubuntu 22.04+ / RHEL 9+ (glibc 2.34), macOS 14+.
        os: [windows-latest, ubuntu-22.04, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (stable, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # what the Tauri shell (apps/desktop/src-tauri, a workspace member) links on Linux
      - name: Install Tauri's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      # The shell embeds the generated interface (frontendDist, ../.output/public) at compile time;
      # the Rust tests don't look at it, so a placeholder page stands in for `pnpm generate`.
      - name: A placeholder for the generated interface
        run: |
          mkdir -p apps/desktop/.output/public
          [ -f apps/desktop/.output/public/index.html ] || echo '<!doctype html><title>SpaceKnife</title>' > apps/desktop/.output/public/index.html

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Generated protocol types are up to date
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q -p sk-protocol --bin gen-ts -- --check
          cargo run --locked -q -p sk-protocol --bin gen-ts -- --check apps/desktop/app/protocol/generated.ts

      - name: Tests
        run: cargo test --workspace --locked

      # SpaceKnife.com, the Windows console launcher (its own small workspace, not a member of the
      # repository's): formatted, lint-free, and its tests (the routing; on Windows, run as a
      # terminal runs it, with stand-ins next to it)
      - name: Console launcher (packaging/console-launcher)
        run: |
          m=packaging/console-launcher/Cargo.toml
          if [ "$RUNNER_OS" = Linux ]; then cargo fmt --manifest-path "$m" --check; fi
          cargo clippy --manifest-path "$m" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$m" --locked

      # The developer tools (tools/*.mjs) read crates/ and design/; Node only, no install. The same on
      # every OS: once.
      - name: Set up Node 24
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tools and generated files
        if: runner.os == 'Linux'
        run: |
          node --test "tools/tests/*.test.mjs"
          node tools/gen_design.mjs --check
          node tools/gen_pinyin.mjs --check
          node tools/i18n_check.mjs --area core

  desktop:
    name: Desktop interface · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      # No packageManager field in apps/desktop/package.json; pnpm-lock.yaml is lockfileVersion 9.0 → pnpm 10.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # The @design alias resolves to the committed design/build artefacts (kept in sync by the Rust
      # job's gen_design.mjs --check), and the protocol types to the committed generated.ts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every interface text needs an English entry (t() falls back to the Chinese source). The
      # result is the same on every OS.
      - name: Translations
        if: runner.os == 'Linux'
        working-directory: .
        run: node tools/i18n_check.mjs --area desktop

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Generate
        run: pnpm generate

  # The one check branch protection requires: skipped jobs report under their unexpanded matrix
  # name, so requiring each job would leave a pull request waiting forever.
  result:
    name: CI passed
    needs: [changes, rust, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a job ended with $r"; exit 1 ;;
            esac
          done
