name: CI

on:
  push:
    branches: [main, dev] # work happens on dev; main changes by merging dev
  pull_request:
  workflow_dispatch: # a manual run tests everything

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.areas.outputs.python }}
      electron: ${{ steps.areas.outputs.electron }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits a push or pull request is compared against

      # Pull request: its merge commit against the base it merges into. Push: the pushed commits.
      # A manual run, a new branch, or a force push whose old commit is gone runs everything.
      # The rules are in .github/scripts/ci-areas.sh.
      - name: Decide which jobs run
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          if [ -n "$base" ]; then
            git -c core.quotepath=off diff --name-only --no-renames "$base" HEAD > changed.txt
            areas=$(bash .github/scripts/ci-areas.sh < changed.txt)
          else
            echo "(everything)" > changed.txt
            areas=$'python=true\nelectron=true'
          fi
          echo "$areas" | tee -a "$GITHUB_OUTPUT"
          { echo "### Jobs to run"; echo; echo "$areas" | sed 's/^/- /'; echo; echo "Changed files:"; echo; echo '```'; cat changed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # the suite takes a few minutes; a hang must not hold a runner for hours
    strategy:
      fail-fast: false
      matrix:
        # Platform floors from docs/PLAN.md: Windows 10+, Ubuntu 22.04+ / RHEL 9+ (glibc 2.34), macOS 14+.
        os: [windows-latest, ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0 # exact version: this action publishes no moving major tag
        with:
          enable-cache: true

      - name: Install Python 3.12 and the workspace
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages/protocol/src packages/backend/src packages/client/src tools/gen_design.py

      - name: Generated artefacts are up to date
        run: |
          uv run python tools/gen_design.py --check
          uv run spaceknife schema --check packages/protocol/schema/protocol.schema.json
          uv run python tools/gen_ts_protocol.py --check

      - name: Tests
        run: uv run pytest

  electron:
    name: Electron · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - uses: actions/checkout@v7

      # No packageManager field in apps/electron/package.json; pnpm-lock.yaml is lockfileVersion 9.0 → pnpm 10.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/electron/pnpm-lock.yaml

      # The renderer's @design alias resolves to the committed design/build artefacts (kept in sync by
      # the python job's gen_design.py --check), so no Python toolchain is needed here. Tests and the
      # build never launch Electron, so its binary download is skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Every renderer text needs an English entry (t() falls back to the Chinese source). The check
      # needs node_modules, which the python job doesn't install; the result is the same on every OS.
      - name: Set up uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v10.2.0 # exact version: this action publishes no moving major tag

      - name: Translations
        if: runner.os == 'Linux'
        working-directory: .
        run: uv run --no-project --python 3.12 tools/i18n_check.py --area electron

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
