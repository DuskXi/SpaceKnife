name: macOS build

# The macOS dmg and portable zip for each architecture, built on a Mac of that architecture
# (apps/desktop `pnpm bundle`: Tauri's SpaceKnife.app and dmg; `pnpm bundle:portable`: the app next to
# a data/ folder, zipped with ditto), named as 0.3.4 names them (SpaceKnife-<v>-mac-<arch>.dmg: the
# update check's contract). The app's executable is Contents/MacOS/SpaceKnife and the swap helper
# 0.3.x portable copies run is Contents/Resources/backend/spaceknife-backend, as 0.3.4 had them.
# Ad-hoc signed and not notarized until there is an Apple Developer ID. The portable zip is
# unpacked again and smoke-tested in portable mode and in headless mode, and its 「无缝更新」 is
# tested end to end twice: to the next version (packaging/update-e2e.mjs) and from the real 0.3.4
# portable copy, which clicks its update card (packaging/update-from-034.mjs); the dmg is put over
# 0.3.4's app the way Finder's 「替换」 does. The files and their checksums go to the run's
# artifacts, and the Release workflow publishes them (release.yml, docs/packaging.md). Started by
# hand (Actions › macOS build › Run workflow), and on dev whenever the packaging changes, so it is
# checked before it reaches main.
on:
  workflow_dispatch:
  # the Release workflow (release.yml) calls it for a release: the tag's commit, and a build
  # provenance attestation for every file (actions/attest-build-provenance)
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build (default the caller's)
        type: string
        default: ""
      attest:
        description: Attest where each file was built
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - .github/workflows/macos.yml
      - packaging/**
      - apps/desktop/scripts/**
      - tools/package_checks.mjs
      - apps/desktop/src-tauri/tauri*.json
      - apps/desktop/src-tauri/src/install.rs
      - apps/desktop/src-tauri/src/portable.rs
      - apps/desktop/src-tauri/src/update.rs
      - crates/sk-core/src/update/**

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dmg:
    name: macOS · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    permissions:
      contents: read
      id-token: write # the attestations, only when the Release workflow asks for them
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-mac-${{ matrix.arch }}

      - name: Install the interface's dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # ad hoc signature ("-"): Gatekeeper still asks once, but the bundle's signature is whole
      - name: Build the app and the dmg
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm bundle

      - name: Build the portable zip
        working-directory: apps/desktop
        run: pnpm bundle:portable

      # the dmg under 0.3.4's name (Tauri's bundler writes SpaceKnife_<v>_<aarch64|x64>.dmg)
      - name: Collect the files
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p target/mac
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          dmg=(target/release/bundle/dmg/*.dmg)
          [ "${#dmg[@]}" = 1 ] || { echo "::error::Tauri made ${#dmg[@]} disk images"; exit 1; }
          cp "${dmg[0]}" "target/mac/SpaceKnife-$version-mac-${{ matrix.arch }}.dmg"
          cp target/portable/*-portable.zip target/mac/
          ls -l target/mac

      # No file names the build machine's home folder (the programs are built with it remapped:
      # scripts/bundle.mjs; tools/package_checks.mjs): the portable zip's members, and the app in the
      # dmg, mounted read-only
      - name: Check the files
        run: |
          set -euo pipefail
          node tools/package_checks.mjs paths target/mac/*-portable.zip
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" target/mac/*.dmg > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null' EXIT
          node tools/package_checks.mjs paths "$mnt"/*.app

      # unpacked the way the app unpacks an update (ditto): the bundle's links, attributes and signature
      - name: Unpack the portable zip again
        run: |
          mkdir -p target/portable-test
          ditto -x -k target/mac/*-portable.zip target/portable-test
          ls target/portable-test/*
          codesign --verify --deep --strict target/portable-test/*/SpaceKnife.app

      # what 0.3.x copies need of it: SpaceKnife.app/Contents/MacOS/SpaceKnife, and the swap helper
      # (spaceknife-cli, signed with the bundle) answering --apply-update
      - name: The layout 0.3.x copies update to
        run: |
          set -euo pipefail
          app=$(ls -d target/portable-test/*/SpaceKnife.app)
          [ -x "$app/Contents/MacOS/SpaceKnife" ] || { echo "::error::no Contents/MacOS/SpaceKnife"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = SpaceKnife ]
          helper="$app/Contents/Resources/backend/spaceknife-backend"
          [ -x "$helper" ] || { echo "::error::no executable Contents/Resources/backend/spaceknife-backend"; exit 1; }
          codesign --verify --strict "$helper"
          set +e
          said=$("$helper" --apply-update); code=$?
          set -e
          echo "spaceknife-backend --apply-update: $said (exit $code)"
          [ "$code" = 2 ] && echo "$said" | grep -q '"ok":false' || { echo "::error::the swap helper does not take --apply-update"; exit 1; }

      - name: Smoke test in portable mode
        run: |
          app=$(ls -d target/portable-test/*/SpaceKnife.app)
          node packaging/smoke-app.mjs --portable "$app/Contents/MacOS/SpaceKnife"

      - name: Headless mode smoke test
        run: |
          app=$(ls -d target/portable-test/*/SpaceKnife.app)
          node packaging/smoke-headless.mjs "$app/Contents/MacOS/spaceknife-cli" --ui apps/desktop/.output/public

      # a release list on 127.0.0.1 offers the next version (this build again); the backend finds,
      # downloads and verifies it, the new version's --apply-update swaps the bundle, the app comes back
      - name: Update end to end (this build to the next)
        timeout-minutes: 15
        run: node packaging/update-e2e.mjs target/mac/*-portable.zip

      # the real 0.3.4 portable copy and disk image of this architecture (checked against the v0.3.4
      # release's own checksums and its build provenance), updated to this build
      - name: Update from 0.3.4 (portable, dmg)
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          a=${{ matrix.arch }}
          mkdir -p "$RUNNER_TEMP/v034"
          gh release download v0.3.4 --repo DuskXi/SpaceKnife --dir "$RUNNER_TEMP/v034"             --pattern "SpaceKnife-0.3.4-mac-$a-portable.zip" --pattern "SpaceKnife-0.3.4-mac-$a.dmg" --pattern "SHA256SUMS-mac-$a.txt"
          (cd "$RUNNER_TEMP/v034" && shasum -a 256 -c "SHA256SUMS-mac-$a.txt")
          for f in "$RUNNER_TEMP"/v034/SpaceKnife-0.3.4-*; do gh attestation verify "$f" --repo DuskXi/SpaceKnife; done
          node packaging/update-from-034.mjs portable "$RUNNER_TEMP/v034/SpaceKnife-0.3.4-mac-$a-portable.zip" target/mac/*-portable.zip --expect-machine "$a"
          node packaging/update-from-034.mjs dmg "$RUNNER_TEMP/v034/SpaceKnife-0.3.4-mac-$a.dmg" target/mac/*.dmg

      - name: Checksum
        working-directory: target/mac
        run: shasum -a 256 *.dmg *-portable.zip | tee "SHA256SUMS-mac-${{ matrix.arch }}.txt"

      - name: Attest the files
        if: inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/mac/*.dmg
            target/mac/*-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SpaceKnife-mac-${{ matrix.arch }}
          path: |
            target/mac/*.dmg
            target/mac/*-portable.zip
            target/mac/SHA256SUMS-mac-*.txt
          if-no-files-found: error
          retention-days: 14
