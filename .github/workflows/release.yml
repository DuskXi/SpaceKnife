name: Release

# Publishes a release from CI: no file goes through anyone's computer (docs/packaging.md「发布」).
# A signed tag vX.Y.Z on GitHub (signed locally: CI never holds the key) builds every file from that
# tag with the Portable, macOS and Electron shell build workflows (the Tauri app's portable archives,
# deb and disk images; the Electron shell's Windows installer, AppImage and rpm), each attesting
# where its files were built and testing their update from the real 0.3.4 files; tools/release.mjs
# then checks every checksum and that exactly the release's files are there (0.3.4's names, which
# crates/sk-core/src/update asset_templates looks for), merges the installer checksums into
# SHA256SUMS.txt, and fills the notes in release-notes/X.Y.Z.md (sizes, links to the build runs);
# before anything is created, 0.3.4's own update code reads the assembled files
# (tools/compat034.mjs: every 0.3.4 install must find its file and checksum); the release is
# created as a draft (published at once only when asked), and a published one is read back the way
# SpaceKnife reads it (cargo run -p sk-core --example release_check) and the way 0.3.4 reads it.
# Run by hand (Actions › Release › Run workflow) for a tag already on GitHub; there it can also take
# the files of earlier Portable (with installers), macOS and Electron shell build runs of the same
# tree instead of building again, and dry_run stops before the release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z), already on GitHub
        required: true
        type: string
      portable_run:
        description: Take the files of this Portable build run (built with installers) instead of building
        type: string
        default: ""
      macos_run:
        description: Take the files of this macOS build run instead of building
        type: string
        default: ""
      electron_run:
        description: Take the files of this Electron shell build run instead of building
        type: string
        default: ""
      publish:
        description: Publish at once (otherwise the release stays a draft)
        type: boolean
        default: false
      dry_run:
        description: Check and assemble only, create no release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      reuse: ${{ steps.tag.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag, the version, the notes and the runs to reuse
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PORTABLE_RUN: ${{ inputs.portable_run }}
          MACOS_RUN: ${{ inputs.macos_run }}
          ELECTRON_RUN: ${{ inputs.electron_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "$TAG is not vX.Y.Z"
          version=${TAG#v}
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" main
          # an annotated tag whose signature GitHub verifies against the maintainer's key
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || fail "$TAG is not an annotated tag"
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(git rev-parse "refs/tags/$TAG")" --jq .verification.verified)
          [ "$verified" = true ] || fail "GitHub does not verify the signature of $TAG"
          # what is released is what main holds
          git diff --quiet "$TAG" origin/main || fail "$TAG has other files than main"
          # the version is written in four places: the interface, the Tauri app, the Electron shell,
          # the Rust workspace
          app=$(git show "$TAG:apps/desktop/package.json" | jq -r .version)
          [ "$app" = "$version" ] || fail "the interface at $TAG is version $app, not $version"
          tauri=$(git show "$TAG:apps/desktop/src-tauri/tauri.conf.json" | jq -r .version)
          [ "$tauri" = "$version" ] || fail "the Tauri app at $TAG is version $tauri, not $version"
          electron=$(git show "$TAG:apps/electron-shell/package.json" | jq -r .version)
          [ "$electron" = "$version" ] || fail "the Electron shell at $TAG is version $electron, not $version"
          crates=$(git show "$TAG:Cargo.toml" | grep -m1 -E '^version *=' | cut -d'"' -f2) # [workspace.package]
          [ "$crates" = "$version" ] || fail "the Rust workspace at $TAG is version $crates, not $version"
          [ -f "release-notes/$version.md" ] || fail "no release-notes/$version.md here ($GITHUB_REF)"
          gh release view "$TAG" >/dev/null 2>&1 && fail "a release $TAG exists already"
          reuse=false
          if [ -n "$PORTABLE_RUN$MACOS_RUN$ELECTRON_RUN" ]; then
            [ -n "$PORTABLE_RUN" ] && [ -n "$MACOS_RUN" ] && [ -n "$ELECTRON_RUN" ] || fail "give all three runs to reuse, or none"
            tree=$(git rev-parse "$TAG^{tree}")
            for pair in "$PORTABLE_RUN:Portable build" "$MACOS_RUN:macOS build" "$ELECTRON_RUN:Electron shell build"; do
              id=${pair%%:*}; want=${pair#*:}
              IFS=$'\t' read -r name conclusion sha < <(gh run view "$id" --json workflowName,conclusion,headSha \
                --jq '[.workflowName, .conclusion, .headSha] | @tsv')
              [ "$name" = "$want" ] || fail "run $id is \"$name\", not \"$want\""
              [ "$conclusion" = success ] || fail "run $id ended with $conclusion"
              git fetch --quiet origin "$sha"
              [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || fail "run $id built $sha, whose files differ from $TAG"
            done
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PORTABLE_RUN/artifacts" --jq '.artifacts[].name' \
              | grep -qx SpaceKnife-installers-linux-x64 || fail "run $PORTABLE_RUN did not build the deb"
            reuse=true
          fi
          { echo "tag=$TAG"; echo "version=$version"; echo "reuse=$reuse"; } >> "$GITHUB_OUTPUT"
          echo "### $TAG: version $version, tree as main, files $([ "$reuse" = true ] && echo "from runs $PORTABLE_RUN, $MACOS_RUN and $ELECTRON_RUN" || echo "built now")" >> "$GITHUB_STEP_SUMMARY"

  portable:
    name: Portable build
    needs: check
    if: needs.check.outputs.reuse != 'true'
    uses: ./.github/workflows/portable.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      installers: true
      ref: ${{ needs.check.outputs.tag }}
      attest: true

  macos:
    name: macOS build
    needs: check
    if: needs.check.outputs.reuse != 'true'
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.check.outputs.tag }}
      attest: true

  electron:
    name: Electron shell build
    needs: check
    if: needs.check.outputs.reuse != 'true'
    uses: ./.github/workflows/electron.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.check.outputs.tag }}
      attest: true

  publish:
    name: Assemble and publish
    needs: [check, portable, macos, electron]
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (needs.check.outputs.reuse == 'true' ||
        (needs.portable.result == 'success' && needs.macos.result == 'success' && needs.electron.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the v0.3.4 tag, whose own update code reads the assembled files

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The files of this run
        if: needs.check.outputs.reuse != 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: SpaceKnife-*
          path: artifacts

      - name: The files of the given runs
        if: needs.check.outputs.reuse == 'true'
        run: |
          gh run download "${{ inputs.portable_run }}" --dir artifacts
          gh run download "${{ inputs.macos_run }}" --dir artifacts
          gh run download "${{ inputs.electron_run }}" --dir artifacts

      - name: Check and assemble
        run: |
          set -euo pipefail
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          if [ "${{ needs.check.outputs.reuse }}" = true ]; then
            runs=(--build-run "$base/${{ inputs.portable_run }}" --build-run "$base/${{ inputs.macos_run }}" --build-run "$base/${{ inputs.electron_run }}")
          else
            runs=(--build-run "$base/$GITHUB_RUN_ID")
          fi
          node tools/release.mjs assemble "$VERSION" artifacts release \
            --notes "release-notes/$VERSION.md" --notes-out notes.md "${runs[@]}"
          cp notes.md release-notes-filled.md

      # every installed 0.3.4 picks the newest release by version first and only then looks for
      # its file under 0.3.4's names: its own code (v0.3.4's tree and Python environment) must find
      # every kind of install's file and checksum among the assembled files, and its window must
      # take them (tools/compat034.mjs)
      - name: 0.3.4 finds its files
        run: |
          set -euo pipefail
          pipx install uv==0.8.4
          mkdir -p "$RUNNER_TEMP/v034"
          git archive --format=tar v0.3.4 | tar -x -C "$RUNNER_TEMP/v034"
          ~/.local/bin/uv sync --project "$RUNNER_TEMP/v034" --frozen --no-default-groups --package spaceknife-backend --python 3.12
          node tools/compat034.mjs --tree "$RUNNER_TEMP/v034" --version "$VERSION" --dir release

      - name: Keep what would be published
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.check.outputs.version }}
          path: |
            release/*
            release-notes-filled.md
          retention-days: 14

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "SpaceKnife $VERSION" --notes-file notes.md)
          # every 0.x version and every version with a pre-release part is a pre-release
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if [ "${{ inputs.publish }}" != true ]; then flags+=(--draft); fi
          gh release create "$TAG" "${flags[@]}" release/*
          gh release view "$TAG" --json url,isDraft --jq '"release: \(.url) (draft: \(.isDraft))"' | tee -a "$GITHUB_STEP_SUMMARY"

  read-back:
    name: Read the release as SpaceKnife does
    needs: [check, publish]
    if: ${{ inputs.publish && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install --no-self-update # the one rust-toolchain.toml pins

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-check

      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.check.outputs.version }}
          path: assembled

      - name: Every kind of install finds its file and checksum
        run: cargo run --locked -q -p sk-core --example release_check -- "${{ needs.check.outputs.version }}" --sums assembled/release --download

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # what an installed 0.3.4 finds in the published release (its own code, tools/compat034.mjs)
      - name: 0.3.4 finds its files
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin tag v0.3.4
          pipx install uv==0.8.4
          mkdir -p "$RUNNER_TEMP/v034"
          git archive --format=tar v0.3.4 | tar -x -C "$RUNNER_TEMP/v034"
          ~/.local/bin/uv sync --project "$RUNNER_TEMP/v034" --frozen --no-default-groups --package spaceknife-backend --python 3.12
          node tools/compat034.mjs --tree "$RUNNER_TEMP/v034" --version "${{ needs.check.outputs.version }}" --github
