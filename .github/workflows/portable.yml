name: Portable build

# The portable archives (docs/packaging.md): the program, spaceknife-cli, the interface for headless
# mode and a data/ folder that keeps the app's data next to it, a zip on Windows and a tar.gz on
# Linux, for x64 and arm64, each built on a runner of its architecture (`pnpm tauri build
# --no-bundle`, then apps/desktop `pnpm bundle:portable`). Each archive is unpacked again and
# smoke-tested in portable mode and in headless mode, and its 「无缝更新」 is tested end to end
# (packaging/update-e2e.mjs); the archives and their checksums go to the run's artifacts, and the
# Release workflow publishes them (release.yml). Started by hand (Actions › Portable build › Run
# workflow), and on dev whenever the packaging changes, so it is checked before it reaches main.
# With "installers" (by hand, for a release) the same run also builds Tauri's Windows installer
# (NSIS) and the Linux AppImage / deb / rpm from the same commit (`pnpm bundle`), with their own
# checksums (x64 only: the ARM jobs make the portable archives alone); the Windows installer is
# installed, run and uninstalled (packaging/nsis-e2e.mjs) and the AppImage is run.
# The Release workflow (release.yml) calls it for a release: installers on, the tag's commit, and
# a build provenance attestation for every file (actions/attest-build-provenance).
on:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build the installers (for a release)
        type: boolean
        default: false
  workflow_call:
    inputs:
      installers:
        type: boolean
        default: false
      ref:
        description: The commit or tag to build (default the caller's)
        type: string
        default: ""
      attest:
        description: Attest where each file was built
        type: boolean
        default: false
  push:
    branches: [dev, dev-rust]
    paths:
      - .github/workflows/portable.yml
      - packaging/**
      - apps/desktop/scripts/**
      - apps/desktop/src-tauri/tauri*.json
      - apps/desktop/src-tauri/src/install.rs
      - apps/desktop/src-tauri/src/portable.rs
      - apps/desktop/src-tauri/src/update.rs
      - crates/sk-core/src/update/**

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  portable:
    name: Portable · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            installer: true # the installers are published for x64 only
          - target: win-arm64
            runner: windows-11-arm
            installer: false
          - target: linux-x64
            runner: ubuntu-22.04 # glibc 2.35 build host; the programs may need at most 2.34 (checked)
            installer: true
          - target: linux-arm64
            runner: ubuntu-22.04-arm # glibc 2.35 here too
            installer: false
    permissions:
      contents: read
      id-token: write # the attestations, only when the Release workflow asks for them
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # the Windows on ARM runner comes without Rust: rustup for its architecture first
      - name: Set up Rust
        run: |
          if command -v rustup >/dev/null; then
            rustup update stable --no-self-update && rustup default stable
          elif [ "$RUNNER_OS" = Windows ]; then
            target=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)-pc-windows-msvc
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$target/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable --no-modify-path
            cygpath -w "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          else
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.target }}

      # Tauri's build libraries, xvfb for the window without a display, and what the AppImage
      # bundler (linuxdeploy) runs
      - name: Install Tauri's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb file

      - name: Install the interface's dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # the programs only, no installer (beforeBuildCommand: the interface, spaceknife-cli, the licences)
      - name: Build the programs
        if: ${{ !(inputs.installers && matrix.installer) }}
        working-directory: apps/desktop
        run: pnpm tauri build --config src-tauri/tauri.bundle.json --no-bundle

      - name: Build the programs and the installers
        if: ${{ inputs.installers && matrix.installer }}
        working-directory: apps/desktop
        run: pnpm bundle

      - name: Build the portable archive
        working-directory: apps/desktop
        run: pnpm bundle:portable

      - name: The programs need at most glibc 2.34
        if: runner.os == 'Linux'
        run: |
          for bin in target/release/spaceknife target/release/spaceknife-cli; do
            need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$bin: glibc $need"
            [ "$(printf '%s\n2.34\n' "$need" | sort -V | tail -1)" = 2.34 ] || { echo "::error::$bin needs glibc $need"; exit 1; }
          done

      - name: Unpack it again
        run: |
          shopt -s nullglob
          archive=(target/portable/*-portable.zip target/portable/*-portable.tar.gz)
          echo "archive=${archive[0]}" >> "$GITHUB_ENV"
          mkdir -p target/portable-test
          if [ "$RUNNER_OS" = Windows ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "${archive[0]}" -C target/portable-test
          else
            tar -xzf "${archive[0]}" -C target/portable-test
          fi
          ls target/portable-test/*

      - name: Smoke test in portable mode
        run: |
          app=$(ls -d target/portable-test/*/spaceknife{,.exe} 2>/dev/null | head -1)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node packaging/smoke-app.mjs --portable "$app"
          else
            node packaging/smoke-app.mjs --portable "$app"
          fi

      # no window, the interface over HTTP (spaceknife-cli headless, the ui folder next to it); on
      # Linux without a display
      - name: Headless mode smoke test
        run: |
          cli=$(ls -d target/portable-test/*/spaceknife-cli{,.exe} 2>/dev/null | head -1)
          node packaging/smoke-headless.mjs "$cli"

      # a release list on 127.0.0.1 offers the next version (this build again); the backend finds,
      # downloads and verifies it, the new version's --apply-update swaps the files, the app comes back
      - name: Update end to end (portable)
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node packaging/update-e2e.mjs "$archive"
          else
            node packaging/update-e2e.mjs "$archive"
          fi

      - name: Checksum
        working-directory: target/portable
        run: sha256sum "$(basename "$archive")" | tee "SHA256SUMS-portable-${{ matrix.target }}.txt"

      - name: Collect the installers
        if: inputs.installers && matrix.installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p target/installers
          b=target/release/bundle
          cp $b/nsis/*-setup.exe $b/appimage/*.AppImage $b/deb/*.deb $b/rpm/*.rpm target/installers/
          cd target/installers
          ls -l
          sha256sum * | tee "SHA256SUMS-installers-${{ matrix.target }}.txt"

      - name: Install, run and uninstall (Windows installer)
        if: inputs.installers && matrix.installer && runner.os == 'Windows'
        timeout-minutes: 20
        run: node packaging/nsis-e2e.mjs target/installers/*-setup.exe

      - name: Run the AppImage
        if: inputs.installers && matrix.installer && runner.os == 'Linux'
        run: xvfb-run -a node packaging/smoke-app.mjs --kind appimage target/installers/*.AppImage

      - name: Attest the portable archive
        if: inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/portable/*-portable.zip
            target/portable/*-portable.tar.gz

      - name: Attest the installers
        if: inputs.attest && inputs.installers && matrix.installer
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/installers/*-setup.exe
            target/installers/*.AppImage
            target/installers/*.deb
            target/installers/*.rpm

      - uses: actions/upload-artifact@v7
        if: inputs.installers && matrix.installer
        with:
          name: SpaceKnife-installers-${{ matrix.target }}
          path: |
            target/installers/*-setup.exe
            target/installers/*.AppImage
            target/installers/*.deb
            target/installers/*.rpm
            target/installers/SHA256SUMS-installers-*.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: SpaceKnife-portable-${{ matrix.target }}
          path: |
            target/portable/*-portable.zip
            target/portable/*-portable.tar.gz
            target/portable/SHA256SUMS-portable-*.txt
          if-no-files-found: error
          retention-days: 14
