name: Portable build

# The Tauri app's files (docs/packaging.md): the portable archives — the program, spaceknife-cli,
# the interface for headless mode, the swap helper 0.3.x copies run (resources/backend) and a data/
# folder that keeps the app's data next to it, a zip on Windows and a tar.gz on Linux, for x64 and
# arm64, each built on a runner of its architecture (apps/desktop `pnpm bundle --no-bundle`, build
# paths remapped, then `pnpm bundle:portable`) — and, with "installers", the deb (`pnpm bundle
# --bundles deb`, repacked under 0.3.4's package name spaceknife by tools/deb.mjs). The Windows
# installer has a workflow of its own (windows-installer.yml); the AppImage and the rpm are the
# Electron shell's (electron.yml). Each archive is
# checked (no build-machine home folder in any file, glibc ≤ 2.34 on Linux:
# tools/package_checks.mjs), unpacked again and smoke-tested in portable mode and in headless mode,
# and its 「无缝更新」 is tested end to end twice: from this build to the next version
# (packaging/update-e2e.mjs) and from the real 0.3.4 portable copy of the same target, which clicks
# its update card (packaging/update-from-034.mjs; on Windows on ARM also 0.3.4's x64 copy, which must
# move to the arm64 build). The deb is upgraded from 0.3.4's real deb the same way. The files and
# their checksums go to the run's artifacts, and the Release workflow publishes them (release.yml).
# Started by hand (Actions › Portable build › Run workflow), and on dev whenever the packaging
# changes, so it is checked before it reaches main.
# The Release workflow (release.yml) calls it for a release: installers on, the tag's commit, and
# a build provenance attestation for every file (actions/attest-build-provenance).
on:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build the deb (for a release)
        type: boolean
        default: false
  workflow_call:
    inputs:
      installers:
        type: boolean
        default: false
      ref:
        description: The commit or tag to build (default the caller's)
        type: string
        default: ""
      attest:
        description: Attest where each file was built
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - .github/workflows/portable.yml
      - rust-toolchain.toml
      - .cargo/**
      - packaging/**
      - apps/desktop/scripts/**
      - tools/package_checks.mjs
      - tools/deb.mjs
      - apps/desktop/src-tauri/build.rs
      - apps/desktop/src-tauri/src/main.rs
      - apps/desktop/src-tauri/src/startup_check.rs
      - apps/desktop/src-tauri/tauri*.json
      - apps/desktop/src-tauri/src/install.rs
      - apps/desktop/src-tauri/src/portable.rs
      - apps/desktop/src-tauri/src/update.rs
      - crates/sk-core/src/update/**

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  portable:
    name: Portable · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            ext: zip
            installer: false
          - target: win-arm64
            runner: windows-11-arm
            ext: zip
            installer: false
          - target: linux-x64
            runner: ubuntu-22.04 # glibc 2.35 build host; the programs may need at most 2.34 (checked)
            ext: tar.gz
            installer: true # the deb (x64 only)
          - target: linux-arm64
            runner: ubuntu-22.04-arm # glibc 2.35 here too
            ext: tar.gz
            installer: false
    permissions:
      contents: read
      id-token: write # the attestations, only when the Release workflow asks for them
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }} # gh release download v0.3.4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # the Windows on ARM runner comes without Rust: rustup for its architecture first; then the
      # toolchain rust-toolchain.toml pins
      - name: Set up Rust
        run: |
          if ! command -v rustup >/dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              target=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)-pc-windows-msvc
              curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$target/rustup-init.exe"
              "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none --no-modify-path
              bin="$(cygpath -u "$USERPROFILE")/.cargo/bin"
              cygpath -w "$bin" >> "$GITHUB_PATH"
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
              bin="$HOME/.cargo/bin"
              echo "$bin" >> "$GITHUB_PATH"
            fi
            export PATH="$bin:$PATH"
          fi
          rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.target }}

      # Tauri's build libraries, xvfb for the window without a display, what the deb's checks use
      - name: Install Tauri's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb file

      - name: Install the interface's dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # the programs only (beforeBuildCommand: the interface, spaceknife-cli, the licences);
      # `pnpm bundle` (scripts/bundle.mjs) builds them with the build machine's folders remapped
      - name: Build the programs
        if: ${{ !(inputs.installers && matrix.installer) }}
        working-directory: apps/desktop
        run: pnpm bundle --no-bundle

      - name: Build the programs and the deb
        if: ${{ inputs.installers && matrix.installer }}
        working-directory: apps/desktop
        run: pnpm bundle --bundles deb

      - name: Build the portable archive
        working-directory: apps/desktop
        run: pnpm bundle:portable

      - name: Unpack it again
        run: |
          shopt -s nullglob
          archive=(target/portable/*-portable.zip target/portable/*-portable.tar.gz)
          echo "archive=${archive[0]}" >> "$GITHUB_ENV"
          mkdir -p target/portable-test
          if [ "$RUNNER_OS" = Windows ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "${archive[0]}" -C target/portable-test
          else
            tar -xzf "${archive[0]}" -C target/portable-test
          fi
          ls target/portable-test/*

      # No file of the archive (zip and tar members read) names the build machine's home folder or is
      # owned by its user; on Linux every ELF file in it needs at most glibc 2.34, the RHEL 9 floor;
      # on Windows no program in it imports the Visual C++ runtime, which the archive doesn't ship
      # (+crt-static) (tools/package_checks.mjs)
      - name: Check the archive
        run: |
          node tools/package_checks.mjs paths "$archive"
          if [ "$RUNNER_OS" = Linux ]; then node tools/package_checks.mjs glibc "$archive"; fi
          if [ "$RUNNER_OS" = Windows ]; then node tools/package_checks.mjs crt "$archive"; fi

      # what 0.3.x copies need of it: SpaceKnife.exe / spaceknife at the top, the swap helper
      # (a copy of spaceknife-cli) at resources/backend, answering --apply-update
      # the program answering the helper's --startup-check (it can start here: its libraries, the
      # web view)
      - name: The layout 0.3.x copies update to
        run: |
          shopt -s nullglob
          dir=(target/portable-test/*/)
          if [ "$RUNNER_OS" = Windows ]; then program=SpaceKnife.exe; helper=resources/backend/spaceknife-backend.exe
          else program=spaceknife; helper=resources/backend/spaceknife-backend; fi
          ls "${dir[0]}" | grep -qx "$program" || { echo "::error::no $program (exactly that name) in the archive"; exit 1; }
          [ -x "${dir[0]}$helper" ] || { echo "::error::no executable $helper in the archive"; exit 1; }
          set +e
          said=$("${dir[0]}$helper" --apply-update); code=$?
          set -e
          echo "$helper --apply-update: $said (exit $code)"
          [ "$code" = 2 ] && echo "$said" | grep -q '"ok":false' || { echo "::error::the swap helper does not take --apply-update"; exit 1; }
          set +e
          said=$("${dir[0]}$program" --startup-check); code=$?
          set -e
          echo "$program --startup-check: $said (exit $code)"
          [ "$code" = 0 ] && echo "$said" | grep -q '"ok":true' || { echo "::error::$program does not answer the swap helper's --startup-check"; exit 1; }

      - name: Smoke test in portable mode
        run: |
          # a glob, not `ls` of both names: the missing one would fail the step (pipefail)
          shopt -s nullglob
          app=(target/portable-test/*/SpaceKnife.exe target/portable-test/*/spaceknife)
          app=${app[0]:?the program is missing from the archive}
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node packaging/smoke-app.mjs --portable "$app"
          else
            node packaging/smoke-app.mjs --portable "$app"
          fi

      # no window, the interface over HTTP (spaceknife-cli headless, the ui folder next to it); on
      # Linux without a display
      - name: Headless mode smoke test
        run: |
          shopt -s nullglob
          cli=(target/portable-test/*/spaceknife-cli.exe target/portable-test/*/spaceknife-cli)
          cli=${cli[0]:?spaceknife-cli is missing from the archive}
          node packaging/smoke-headless.mjs "$cli"
          # Windows: 0.3.4's `SpaceKnife --listen … --headless` in a terminal, through SpaceKnife.com
          if [ "$RUNNER_OS" = Windows ]; then
            com=(target/portable-test/*/SpaceKnife.com)
            com=${com[0]:?SpaceKnife.com is missing from the archive}
            node packaging/smoke-headless.mjs --app-form "$com"
          fi

      # a release list on 127.0.0.1 offers the next version (this build again); the backend finds,
      # downloads and verifies it, the new version's --apply-update swaps the files, the app comes back
      # a portable copy still
      - name: Update end to end (this build to the next)
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node packaging/update-e2e.mjs "$archive"
          else
            node packaging/update-e2e.mjs "$archive"
          fi

      # the real 0.3.4 portable copy of this target (checked against the v0.3.4 release's own
      # checksums and its build provenance), its own 「无缝更新」, to this build
      - name: Update from 0.3.4 (portable)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          old="SpaceKnife-0.3.4-${{ matrix.target }}-portable.${{ matrix.ext }}"
          mkdir -p "$RUNNER_TEMP/v034"
          gh release download v0.3.4 --repo DuskXi/SpaceKnife --dir "$RUNNER_TEMP/v034" --pattern "$old" --pattern "SHA256SUMS-portable-${{ matrix.target }}.txt"
          (cd "$RUNNER_TEMP/v034" && sha256sum -c "SHA256SUMS-portable-${{ matrix.target }}.txt")
          gh attestation verify "$RUNNER_TEMP/v034/$old" --repo DuskXi/SpaceKnife
          machine=$([[ "${{ matrix.target }}" == *arm64 ]] && echo arm64 || echo x64)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node packaging/update-from-034.mjs portable "$RUNNER_TEMP/v034/$old" "$archive" --expect-machine "$machine"
          else
            node packaging/update-from-034.mjs portable "$RUNNER_TEMP/v034/$old" "$archive" --expect-machine "$machine"
          fi

      # Windows on ARM: 0.3.4's x64 copy (run emulated) takes the arm64 build, as its update.py
      # asset_templates says, and runs native afterwards
      - name: Update from 0.3.4's x64 copy on ARM
        if: matrix.target == 'win-arm64'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          old=SpaceKnife-0.3.4-win-x64-portable.zip
          gh release download v0.3.4 --repo DuskXi/SpaceKnife --dir "$RUNNER_TEMP/v034" --pattern "$old" --pattern SHA256SUMS-portable-win-x64.txt
          (cd "$RUNNER_TEMP/v034" && sha256sum -c SHA256SUMS-portable-win-x64.txt)
          node packaging/update-from-034.mjs portable "$RUNNER_TEMP/v034/$old" "$archive" --expect-machine arm64

      - name: Checksum
        working-directory: target/portable
        run: sha256sum "$(basename "$archive")" | tee "SHA256SUMS-portable-${{ matrix.target }}.txt"

      # Tauri names the package space-knife; the release's is 0.3.4's spaceknife (tools/deb.mjs)
      - name: The deb under 0.3.4's name
        if: inputs.installers && matrix.installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          tauri=(target/release/bundle/deb/*.deb)
          [ "${#tauri[@]}" = 1 ] || { echo "::error::Tauri made ${#tauri[@]} debs"; exit 1; }
          mkdir -p target/installers
          node tools/deb.mjs "${tauri[0]}" "target/installers/spaceknife_${version/-/\~}_amd64.deb"
          cd target/installers
          dpkg-deb -I spaceknife_*.deb
          sha256sum spaceknife_*.deb | tee "SHA256SUMS-installers-${{ matrix.target }}.txt"

      # The same checks over what the deb installs (its files and its control files); every ELF
      # file in it needs at most glibc 2.34
      - name: Check the deb
        if: inputs.installers && matrix.installer
        run: |
          set -euo pipefail
          rm -rf target/installers-unpacked && mkdir -p target/installers-unpacked
          dpkg-deb -R target/installers/spaceknife_*.deb target/installers-unpacked/deb
          node tools/package_checks.mjs paths target/installers-unpacked
          node tools/package_checks.mjs glibc target/installers-unpacked

      # 0.3.4's real deb installed, then this one over it, as the system's installer does with the
      # file 0.3.4 downloaded (the in-app part is the portable leg's, and tools/compat034.mjs)
      - name: Upgrade from 0.3.4's deb
        if: inputs.installers && matrix.installer
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v034"
          gh release download v0.3.4 --repo DuskXi/SpaceKnife --dir "$RUNNER_TEMP/v034" --pattern spaceknife_0.3.4_amd64.deb --pattern SHA256SUMS.txt --clobber
          (cd "$RUNNER_TEMP/v034" && grep ' spaceknife_0.3.4_amd64.deb$' SHA256SUMS.txt | sha256sum -c -)
          xvfb-run -a node packaging/update-from-034.mjs deb "$RUNNER_TEMP/v034/spaceknife_0.3.4_amd64.deb" target/installers/spaceknife_*.deb

      - name: Attest the portable archive
        if: inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/portable/*-portable.zip
            target/portable/*-portable.tar.gz

      - name: Attest the deb
        if: inputs.attest && inputs.installers && matrix.installer
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/installers/*.deb

      - uses: actions/upload-artifact@v7
        if: inputs.installers && matrix.installer
        with:
          name: SpaceKnife-installers-${{ matrix.target }}
          path: |
            target/installers/*.deb
            target/installers/SHA256SUMS-installers-*.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: SpaceKnife-portable-${{ matrix.target }}
          path: |
            target/portable/*-portable.zip
            target/portable/*-portable.tar.gz
            target/portable/SHA256SUMS-portable-*.txt
          if-no-files-found: error
          retention-days: 14
