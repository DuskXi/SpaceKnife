name: Portable build

# The portable archives (docs/packaging.md): the unpacked app plus a data/ folder that keeps the
# app's data next to it, a zip on Windows and a tar.gz on Linux. Each archive is unpacked again and
# smoke-tested in portable mode; the archives and their checksums go to the run's artifacts, and a
# maintainer attaches them to a release. Started by hand (Actions › Portable build › Run workflow),
# and on dev whenever the packaging changes, so it is checked before it reaches main.
# With "installers" (by hand, for a release) the same run also builds the Windows installer and the
# Linux deb / rpm / AppImage from the same commit, with their own checksums.
# Every run also tests 「重启并更新」 end to end (packaging/update_e2e.py): the portable copy swaps its
# files, and on Windows the installer upgrades from the newest published release, updates from inside
# the app and uninstalls cleanly. The Windows job therefore always builds the installer.
on:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build the installers (for a release)
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - .github/workflows/portable.yml
      - tools/build_package.py
      - packaging/**
      - apps/electron/electron-builder.yml
      - apps/electron/src/main/portable.ts
      - apps/electron/src/main/update.ts
      - apps/electron/build/installer.nsh

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            exe: SpaceKnife.exe
          - target: linux-x64
            runner: ubuntu-22.04 # glibc 2.35 build host; the bundle needs at most 2.34 (checked)
            exe: spaceknife
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0 # exact version: this action publishes no moving major tag
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/electron/pnpm-lock.yaml

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Install Python 3.12 and the build tools
        run: |
          uv python install 3.12
          uv sync --locked --group native --group package

      - name: Install the Electron app's dependencies
        working-directory: apps/electron
        run: pnpm install --frozen-lockfile

      - name: Install rpmbuild and zsyncmake (the rpm and zsync packages)
        if: inputs.installers && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm zsync

      - name: Build the portable archive
        if: ${{ !inputs.installers && runner.os == 'Linux' }}
        run: uv run python tools/build_package.py --portable --no-installers

      # on Windows always: the update test below installs it
      - name: Build the portable archive and the installers
        if: ${{ inputs.installers || runner.os == 'Windows' }}
        run: uv run python tools/build_package.py --portable

      - name: Unpack it again
        run: |
          mkdir -p dist/portable-test
          if [ "$RUNNER_OS" = Windows ]; then
            uv run python -m zipfile -e dist/electron/*-portable.zip dist/portable-test
          else
            tar -xzf dist/electron/*-portable.tar.gz -C dist/portable-test
          fi
          ls dist/portable-test/*

      - name: Smoke test in portable mode
        run: |
          app=$(ls -d dist/portable-test/*/"${{ matrix.exe }}")
          if [ "$RUNNER_OS" = Linux ]; then
            if ! command -v xvfb-run >/dev/null; then
              sudo apt-get update && sudo apt-get install -y xvfb
            fi
            xvfb-run -a uv run python packaging/smoke_app.py --portable "$app"
          else
            uv run python packaging/smoke_app.py --portable "$app"
          fi

      # a release list on 127.0.0.1 offers the next version (this build again); the test clicks the
      # update badge and 「重启并更新」 through the DevTools port, like a user
      - name: Update end to end (portable)
        timeout-minutes: 15
        run: |
          shopt -s nullglob
          archive=(dist/electron/*-portable.zip dist/electron/*-portable.tar.gz)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a uv run python packaging/update_e2e.py portable "${archive[0]}"
          else
            uv run python packaging/update_e2e.py portable "${archive[0]}"
          fi

      - name: Download the newest published installer (the upgrade starts from it)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo DuskXi/SpaceKnife --limit 10 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not)][0].tagName')
          echo "newest release: $tag"
          gh release download "$tag" --repo DuskXi/SpaceKnife --dir dist/previous \
            --pattern '*-Setup-x64.exe' --pattern 'SHA256SUMS.txt'
          ls -l dist/previous

      - name: Update and uninstall end to end (Windows installer)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        run: |
          shopt -s nullglob
          setup=(dist/electron/SpaceKnife-*-Setup-x64.exe)
          previous=(dist/previous/SpaceKnife-*-Setup-x64.exe)
          uv run python packaging/update_e2e.py nsis "${setup[0]}" --previous "${previous[0]}"

      - name: Checksum
        working-directory: dist/electron
        run: sha256sum *-portable.* | tee "SHA256SUMS-portable-${{ matrix.target }}.txt"

      - name: Checksum the installers
        if: inputs.installers
        working-directory: dist/electron
        run: |
          shopt -s nullglob
          sha256sum *-Setup-x64.exe *.AppImage *.deb *.rpm | tee "SHA256SUMS-installers-${{ matrix.target }}.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            # AppImageUpdate reads the update information the build wrote, and the .zsync next to it
            info=$(./*.AppImage --appimage-updateinformation)
            echo "update information: $info"
            [[ "$info" == gh-releases-zsync\|DuskXi\|SpaceKnife\|latest-all\|* ]]
            ls -l *.AppImage.zsync
          fi

      - uses: actions/upload-artifact@v7
        if: inputs.installers
        with:
          name: SpaceKnife-installers-${{ matrix.target }}
          path: |
            dist/electron/*-Setup-x64.exe
            dist/electron/*.AppImage
            dist/electron/*.AppImage.zsync
            dist/electron/*.deb
            dist/electron/*.rpm
            dist/electron/SHA256SUMS-installers-*.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: SpaceKnife-portable-${{ matrix.target }}
          path: |
            dist/electron/*-portable.zip
            dist/electron/*-portable.tar.gz
            dist/electron/SHA256SUMS-portable-*.txt
          if-no-files-found: error
          retention-days: 14
