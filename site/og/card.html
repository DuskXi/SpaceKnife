<!doctype html>
<!-- The social card (1200×630) for link previews: rendered to site/public/og-<lang>.png by
     site/og/capture.cjs. Open with ?lang=en or ?lang=zh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/geist/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/noto-sans-sc/index.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #08090b;
        color: #f1f2f5;
        font-family: "Geist Variable", "Noto Sans SC Variable", sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(42rem 26rem at 18% -6rem, rgb(139 156 255 / 0.28), transparent 70%),
          radial-gradient(30rem 22rem at 100% 100%, rgb(212 255 58 / 0.08), transparent 70%),
          #08090b;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(70% 90% at 20% 30%, #000, transparent 80%);
      }
      .left {
        position: absolute;
        left: 72px;
        top: 76px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 54px 0 0;
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -0.045em;
        font-weight: 700;
      }
      h1 span {
        display: block;
      }
      .grad {
        background: linear-gradient(100deg, #8b9cff 10%, #b9c4ff 45%, #d4ff3a 95%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .meta {
        margin-top: 34px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill {
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 18px;
        color: #aeb3be;
        background: rgb(255 255 255 / 0.04);
        box-shadow: inset 0 0 0 1px #2a2e37;
      }
      .pill b {
        color: #d4ff3a;
        font-weight: 600;
      }
      .shot {
        position: absolute;
        left: 640px;
        top: 70px;
        width: 760px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px #2a2e37,
          0 30px 90px -20px rgb(0 0 0 / 0.9),
          0 40px 140px -40px rgb(139 156 255 / 0.55);
        transform: perspective(1800px) rotateY(-14deg) rotateX(4deg);
        transform-origin: 0 50%;
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="left">
        <div class="brand"><img src="../public/favicon.svg" alt="" />SpaceKnife</div>
        <h1 id="h1"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="shot"><img id="shot" alt="" /></div>
    </div>
    <script>
      const lang = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
      const t = {
        en: { a: "See what fills", b: "your drives.", pills: ["<b>Free</b> &amp; open source", "Windows · Linux", "MIT"], shot: "treemap-en.png" },
        zh: { a: "看清磁盘", b: "被什么占满。", pills: ["<b>免费</b>开源", "Windows · Linux", "MIT"], shot: "treemap.png" },
      }[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.getElementById("h1").innerHTML = `<span>${t.a}</span><span class="grad">${t.b}</span>`;
      document.getElementById("meta").innerHTML = t.pills.map((p) => `<span class="pill">${p}</span>`).join("");
      document.getElementById("shot").src = `../../docs/images/${t.shot}`;
    </script>
  </body>
</html>
