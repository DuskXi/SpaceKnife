[package]
name = "sk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sk-store = { workspace = true }
sk-protocol = { workspace = true }
sk-native = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
# platform task (log, settings_io, update)
tracing-subscriber = { workspace = true }
roxmltree = { workspace = true }
ureq = { workspace = true }
# system task (helper, disks, io): plist output of diskutil / ioreg (parsed on every platform: tested here)
plist = "1.7"

# analysis task (ops): recycle bin, Restart Manager, registry
[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_RestartManager", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_WNet", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_Pipes", "Win32_System_Performance", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Security_Cryptography", "Wdk_System_Threading", "Win32_System_Kernel"]

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
tempfile = { workspace = true }

[dev-dependencies.sk-store]
workspace = true
features = ["test-support"]
