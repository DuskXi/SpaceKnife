[package]
name = "sk-native"
version.workspace = true
edition.workspace = true
description = "Native scanning for SpaceKnife: NTFS $MFT parsing and parallel directory scans"
license = "MIT"
publish = false

[lib]
name = "sk_native"

[features]
default = ["mft", "hardscan"]
mft = []
hardscan = []

[dependencies]
rayon = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Wdk_System_SystemServices", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "hardscan"
required-features = ["hardscan"]

[[test]]
name = "mft"
required-features = ["mft"]
