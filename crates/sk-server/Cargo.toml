[package]
name = "sk-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sk-core = { workspace = true }
sk-store = { workspace = true }
sk-protocol = { workspace = true }
sk-native = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true }
axum = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
parking_lot = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
getrandom = "0.3"
sha2 = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1.12"
# headless mode's guarded server (http.rs serve_guarded): HTTP/1 with header timeouts, as axum's
# own server has none; the versions and features axum already uses
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.3", features = ["tokio", "service"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# cli task: the console binary (spaceknife-cli)
clap = { workspace = true }
unicode-width = "0.2"
tracing-subscriber = { workspace = true }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemInformation"]

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[dev-dependencies]
regex = { workspace = true }
tokio-tungstenite = "0.29"
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
sk-store = { workspace = true, features = ["test-support"] }
