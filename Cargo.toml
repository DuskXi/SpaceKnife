[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "MIT"
authors = ["DuskXi"]
repository = "https://github.com/DuskXi/SpaceKnife"

[workspace.dependencies]
sk-native = { path = "crates/sk-native" }
sk-protocol = { path = "crates/sk-protocol" }
sk-store = { path = "crates/sk-store" }
sk-core = { path = "crates/sk-core" }
sk-server = { path = "crates/sk-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
rayon = "1.12"
parking_lot = "0.12"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
regex = "1"
libc = "0.2"
tempfile = "3"
zstd = { version = "0.13", default-features = false }
schemars = { version = "1.2", features = ["chrono04"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
roxmltree = "0.20"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
